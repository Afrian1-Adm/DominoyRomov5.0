<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneos · Club Dominó y Romo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#0f172a;
 --surface:#152238;
 --surface2:#1d2a44;
 --text:#f8fafc;
 --muted:#a9b6ca;
 --line:#33445f;
 --blue:#3b82f6;
 --blueSoft:rgba(59,130,246,.12);
 --green:#22c55e;
 --greenSoft:rgba(34,197,94,.11);
 --red:#ef4444;
 --redSoft:rgba(239,68,68,.10);
 --amber:#f59e0b;
 --amberSoft:rgba(245,158,11,.12);
 --violet:#8b5cf6;
 --shadow:0 8px 26px rgba(0,0,0,.12);
 --radius:18px;
 --radius2:13px;
}

html.light-mode{
 --bg:#f7f9fc;
 --surface:#ffffff;
 --surface2:#f8fafc;
 --text:#111827;
 --muted:#667085;
 --line:#dbe3ee;
 --blue:#1769e8;
 --blueSoft:#f3f7ff;
 --green:#0d8a3c;
 --greenSoft:#f3fbf5;
 --red:#dc2626;
 --redSoft:#fff5f5;
 --amber:#b77900;
 --amberSoft:#fff8e8;
 --shadow:0 6px 22px rgba(15,23,42,.045);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:var(--bg);color:var(--text);padding:18px 12px 32px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.container{max-width:1050px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.small{font-size:.78rem;color:var(--muted)}
.muted{color:var(--muted)}
.bold{font-weight:800}
.center{text-align:center}

.topbar{
 display:flex;align-items:center;justify-content:space-between;gap:12px;
 margin-bottom:18px;
}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:44px;height:44px;object-fit:contain}
.brand h1{font-size:1.35rem;margin:0}
.brand .small{margin-top:2px}

.card{
 background:var(--surface);
 border:1px solid var(--line);
 border-radius:var(--radius);
 padding:16px;
 box-shadow:var(--shadow);
}

.card-flat{
 background:var(--surface);
 border:1px solid var(--line);
 border-radius:var(--radius2);
 padding:13px;
}

.section-title{
 display:flex;align-items:center;justify-content:space-between;gap:10px;
 margin:0 0 11px;
 font-size:1.04rem;font-weight:900;
}

.btn{
 min-height:42px;padding:9px 14px;border-radius:12px;border:1px solid transparent;
 background:var(--blueSoft);color:var(--text);font-weight:800;
}
.btn:hover{filter:brightness(1.03)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:var(--surface);border-color:var(--line)}
.btn.primary{background:var(--blue);color:white}
.btn.green{background:var(--greenSoft);color:var(--green);border-color:rgba(34,197,94,.28)}
.btn.red{background:var(--redSoft);color:var(--red);border-color:rgba(239,68,68,.25)}
.btn.amber{background:var(--amberSoft);color:var(--amber);border-color:rgba(245,158,11,.28)}
.btn.violet{background:rgba(139,92,246,.10);color:#8b5cf6;border-color:rgba(139,92,246,.25)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:.76rem}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 150px}

input,select,textarea{
 width:100%;min-height:44px;padding:10px 12px;
 border-radius:12px;border:1px solid var(--line);
 background:var(--surface2);color:var(--text);outline:none;
}
textarea{min-height:78px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.10)}
label{display:block;font-size:.76rem;font-weight:800;color:var(--muted);margin-bottom:5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.form{display:flex;flex-direction:column;gap:11px}

.badge{
 display:inline-flex;align-items:center;justify-content:center;gap:5px;
 padding:5px 9px;border-radius:999px;font-size:.7rem;font-weight:850;
 background:var(--surface2);border:1px solid var(--line);
}
.badge.inscripciones{background:var(--blueSoft);color:var(--blue)}
.badge.cerrado{background:var(--amberSoft);color:var(--amber)}
.badge.en_curso{background:var(--greenSoft);color:var(--green)}
.badge.finalizado{background:rgba(139,92,246,.10);color:var(--violet)}
.badge.cancelado{background:var(--redSoft);color:var(--red)}

.torneo-card{
 background:var(--surface);
 border:1px solid var(--line);
 border-radius:16px;
 padding:14px;
 box-shadow:var(--shadow);
}
.torneo-title{font-size:1rem;font-weight:900}
.torneo-meta{font-size:.75rem;color:var(--muted);margin-top:4px}
.torneo-actions{display:flex;gap:8px;margin-top:12px}

.notice{
 border:1px solid var(--line);border-radius:13px;padding:12px;
 background:var(--surface2);font-size:.83rem;
}
.notice.info{background:var(--blueSoft);border-color:rgba(59,130,246,.28)}
.notice.good{background:var(--greenSoft);border-color:rgba(34,197,94,.28)}
.notice.warn{background:var(--amberSoft);border-color:rgba(245,158,11,.28)}

.list{display:flex;flex-direction:column;gap:8px}
.list-row{
 display:flex;align-items:center;justify-content:space-between;gap:12px;
 background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
}
.list-main{min-width:0}
.list-name{font-weight:800;overflow-wrap:anywhere}
.list-meta{font-size:.72rem;color:var(--muted);margin-top:2px}

.detail-toolbar{
 display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;
}
.detail-toolbar .btn{width:100%}
.detail-header{margin-bottom:14px}
.detail-header h2{margin:0;font-size:1.25rem}
.detail-sub{color:var(--muted);font-size:.78rem;margin-top:4px}

.pair-grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;
}
.pair-card{
 border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px;
}
.pair-card strong{font-weight:900}
.pair-names{font-weight:780;margin-top:5px;line-height:1.35}

.team-grid{
 display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;
}
.team-card{
 min-width:0;border-radius:18px;padding:18px;border:1px solid;
}
.team-card.a{background:var(--blueSoft);border-color:rgba(59,130,246,.34)}
.team-card.b{background:var(--greenSoft);border-color:rgba(34,197,94,.32)}
.team-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.team-name{font-size:1.35rem;font-weight:950}
.team-card.a .team-name,.team-card.a .team-wins strong{color:var(--blue)}
.team-card.b .team-name,.team-card.b .team-wins strong{color:var(--green)}
.team-wins{text-align:right;font-size:.7rem;color:var(--muted)}
.team-wins strong{display:block;font-size:2rem;line-height:1;margin-top:4px}
.team-leader{font-size:.82rem;margin-top:10px}
.team-divider{height:1px;background:var(--line);margin:16px 0}
.team-label{font-size:.8rem;font-weight:900;margin-bottom:10px}
.team-players{display:flex;flex-direction:column;gap:9px}
.team-player{font-weight:800;font-size:.9rem}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0 7px;min-width:560px}
th{font-size:.66rem;text-transform:uppercase;color:var(--muted);padding:7px;text-align:center}
td{
 background:var(--surface2);padding:10px 7px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
 text-align:center;font-size:.78rem;
}
td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}
td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
td.name{text-align:left;font-weight:850}
.rank{
 display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;
 background:var(--surface);border:1px solid var(--line);font-weight:900;
}
.rank.r1{background:#fef3c7;color:#92400e}
.rank.r2{background:#e5e7eb;color:#475569}
.rank.r3{background:#ffedd5;color:#9a3412}
.eff{font-weight:900}
.eff.good{color:var(--green)}
.eff.bad{color:var(--red)}

.rounds{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.round{
 min-width:300px;flex:1;background:transparent;
}
.round h3{font-size:.9rem;margin:0 0 8px;color:var(--blue)}
.match{
 background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:11px;margin-bottom:10px;
 box-shadow:var(--shadow);
}
.match-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}
.match-number{font-size:.76rem;font-weight:900}
.match-state{font-size:.66rem;color:var(--muted)}
.match-grid{
 display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1fr);gap:6px;align-items:stretch;
}
.side{
 min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface2);
}
.side.winner{background:var(--greenSoft);border-color:rgba(34,197,94,.42)}
.side-name{font-size:.76rem;font-weight:850;overflow-wrap:anywhere;line-height:1.3}
.side-score{font-size:1.35rem;font-weight:950;margin-top:8px}
.side.winner .side-score{color:var(--green)}
.vs{
 width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
 display:flex;align-items:center;justify-content:center;align-self:center;justify-self:center;
 font-size:.65rem;font-weight:900;color:var(--muted);
}
.match-action{margin-top:8px}
.match-action .btn{width:100%}

.lineup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lineup-card{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface2)}
.lineup-card.a{border-color:rgba(59,130,246,.3)}
.lineup-card.b{border-color:rgba(34,197,94,.3)}
.lineup-card h4{margin:0 0 9px}

.champion{
 padding:16px;border-radius:16px;background:linear-gradient(135deg,var(--amberSoft),var(--greenSoft));
 border:1px solid rgba(245,158,11,.32);text-align:center;
}
.champion .cup{font-size:2rem}
.champion strong{display:block;font-size:1.1rem;margin-top:4px}

@media(max-width:700px){
 body{padding:12px 9px 26px}
 .brand .small{display:none}
 .brand h1{font-size:1.1rem}
 .form-grid{grid-template-columns:1fr}
 .pair-grid{grid-template-columns:1fr}
 .team-grid{gap:8px}
 .team-card{padding:12px}
 .team-name{font-size:1.05rem}
 .team-wins strong{font-size:1.55rem}
 .team-player{font-size:.73rem}
 .lineup-grid{grid-template-columns:1fr}
 .round{min-width:270px}
 table{min-width:500px}
}

@media(max-width:390px){
 .team-card{padding:10px}
 .team-name{font-size:.96rem}
 .team-player{font-size:.68rem}
 .team-wins{font-size:.6rem}
 .team-wins strong{font-size:1.35rem}
}
</style>

<script>
(() => {
 const theme=localStorage.getItem('theme')||'dark';
 if(theme==='light')document.documentElement.classList.add('light-mode');
})();
</script>
</head>

<body>
<div class="container">

 <!-- ======================================================= -->
 <!-- LISTA DE TORNEOS                                        -->
 <!-- ======================================================= -->
 <section id="vistaLista">

  <div class="topbar">
   <div class="brand">
    <img src="logo.png" alt="Logo">
    <div>
     <h1>🏆 Torneos</h1>
     <div class="small">Módulo nuevo</div>
    </div>
   </div>
   <button class="btn secondary" onclick="location.href='lobby.html'">← Lobby</button>
  </div>

  <div id="sesionBox" class="card" style="margin-bottom:14px"></div>

  <div id="crearBox" class="card hidden" style="margin-bottom:14px">
   <div class="section-title"><span>➕ Crear torneo</span><span class="small">Administración</span></div>

   <form id="formCrear" class="form">

    <div class="form-grid">
     <div>
      <label>Nombre</label>
      <input id="crearNombre" required placeholder="Ej. Copa del Viernes">
     </div>
     <div>
      <label>Puntos por partida</label>
      <input id="crearLimite" type="number" min="50" step="50" value="200" required>
     </div>
    </div>

    <div>
     <label>Modalidad</label>
     <select id="crearModalidad">
      <option value="parejas">👫 Parejas Fijas</option>
      <option value="equipo_ab">🔵🟢 Equipo A vs B</option>
      <option value="rotando_frente">🔄 Rotando Frentes</option>
     </select>
    </div>

    <div id="crearParejasConfig">
     <label>Sistema de Parejas Fijas</label>
     <select id="crearSistema">
      <option value="eliminacion_directa">🏆 Eliminación Directa</option>
      <option value="suizo">♟️ Sistema Suizo</option>
      <option value="todos_contra_todos">🔁 Todos contra Todos</option>
     </select>
    </div>

    <div id="crearSuizoConfig" class="hidden">
     <label>Cantidad de rondas suizas</label>
     <input id="crearRondas" type="number" min="1" max="30" value="5">
    </div>

    <div id="crearABConfig" class="hidden">
     <label>Meta de victorias Equipo A vs B</label>
     <input id="crearMeta" type="number" min="1" value="16">
    </div>

    <div id="crearRotandoInfo" class="notice info hidden">
     <strong>🔄 Rotando Frentes</strong>
     <div class="small" style="margin-top:4px">
      Cada jugador jugará exactamente una partida como compañero de cada uno de los demás.
      Para generar el calendario completo se admiten 4, 5, 8, 9, 12, 13... jugadores.
     </div>
    </div>

    <div>
     <label>Descripción</label>
     <textarea id="crearDescripcion" placeholder="Opcional"></textarea>
    </div>

    <button class="btn primary" type="submit">Crear torneo</button>
   </form>
  </div>

  <div class="row" style="margin-bottom:10px">
   <div class="bold">Torneos activos</div>
   <button class="btn secondary sm" onclick="cargarLista()">↻ Actualizar</button>
  </div>

  <div id="listaActivos" class="stack"></div>

  <div class="row" style="margin:22px 0 10px">
   <div class="bold">Historial</div>
   <span id="historialCount" class="small"></span>
  </div>

  <div id="listaHistorial" class="stack"></div>
 </section>


 <!-- ======================================================= -->
 <!-- DETALLE DEL TORNEO                                      -->
 <!-- ======================================================= -->
 <section id="vistaDetalle" class="hidden">

  <div class="detail-toolbar">
   <button class="btn secondary" onclick="volverLista()">← Volver a Torneos</button>
   <button class="btn secondary" onclick="refrescarDetalle()">↻ Actualizar</button>
  </div>

  <div id="detalleHeader" class="detail-header"></div>
  <div id="detalleActions" class="actions" style="margin-bottom:14px"></div>
  <div id="detalleContent" class="stack"></div>

 </section>

</div>

<script>
const SUPABASE_URL='https://kzbslfwupzwczmjqfjem.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YnNsZnd1cHp3Y3ptanFmamVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDI1MzksImV4cCI6MjEwMjcxODUzOX0.qeeh2FV3zKRet-jRMVvJUwBm9jYHsLbWSYWIao574qc';

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let usuario=null;
let perfil=null;
let esAdmin=false;
let torneoActual=null;
let perfiles=[];
let perfilesMap=new Map();
let detalleCargando=false;
let canal=null;
let realtimeTimer=null;

const TORNEO_FILE=location.pathname.split('/').pop()||'torneos.html';

function esc(v){
 return String(v??'')
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'","&#039;");
}

function nombrePerfil(p){
 return p?.username||p?.nombre_completo||'Jugador';
}

function nombreId(id){
 return nombrePerfil(perfilesMap.get(id));
}

function modalidadTexto(t){
 if(t.modalidad==='parejas'){
  const s={
   eliminacion_directa:'Eliminación Directa',
   suizo:'Sistema Suizo',
   todos_contra_todos:'Todos contra Todos'
  }[t.sistema_parejas]||'Parejas Fijas';
  return `👫 Parejas Fijas · ${s}`;
 }
 if(t.modalidad==='equipo_ab')return '🔵🟢 Equipo A vs B';
 if(t.modalidad==='rotando_frente')return '🔄 Rotando Frentes';
 return t.modalidad;
}

function estadoTexto(e){
 return {
  borrador:'Borrador',
  inscripciones:'Inscripciones',
  cerrado:'Cerrado',
  en_curso:'En curso',
  finalizado:'Finalizado',
  cancelado:'Cancelado'
 }[e]||e;
}

function fmtFecha(v){
 if(!v)return '';
 try{
  return new Date(v).toLocaleString('es-DO',{
   day:'2-digit',month:'2-digit',year:'numeric',
   hour:'numeric',minute:'2-digit'
  });
 }catch{return '';}
}

async function rpc(nombre,args={}){
 const {data,error}=await sb.rpc(nombre,args);
 if(error)throw error;
 if(data?.success===false)throw new Error(data.error||'La operación fue rechazada.');
 return data;
}

function errorMsg(e){
 alert(e?.message||String(e)||'Ocurrió un error.');
}

async function cargarPerfiles(){
 const {data,error}=await sb
  .from('perfiles')
  .select('id,username,nombre_completo,elo,estado')
  .order('username');

 if(error){
  console.error(error);
  return;
 }

 perfiles=data||[];
 perfilesMap=new Map(perfiles.map(p=>[p.id,p]));
}

async function inicializar(){
 const {data:{session}}=await sb.auth.getSession();

 if(!session){
  document.getElementById('sesionBox').innerHTML=`
   <div class="notice warn">Debes iniciar sesión para utilizar Torneos.</div>`;
  document.getElementById('crearBox').classList.add('hidden');
  return;
 }

 usuario=session.user;

 const {data:p,error}=await sb
  .from('perfiles')
  .select('id,username,nombre_completo,rol')
  .eq('auth_user_id',usuario.id)
  .maybeSingle();

 if(error)console.error(error);

 perfil=p||null;
 const rol=String(perfil?.rol||'jugador').toUpperCase();
 esAdmin=['ADMIN','ADMINISTRADOR','SUPERADMIN','SUPER_ADMIN','SUPERUSER','SUPERUSUARIO'].includes(rol);

 document.getElementById('sesionBox').innerHTML=`
  <div class="row">
   <div>
    <div class="bold">👤 ${esc(nombrePerfil(perfil)||usuario.email)}</div>
    <div class="small">Rol: ${esc(rol)}</div>
   </div>
   <span class="badge ${esAdmin?'en_curso':'inscripciones'}">
    ${esAdmin?'ADMINISTRACIÓN':'JUGADOR'}
   </span>
  </div>`;

 document.getElementById('crearBox').classList.toggle('hidden',!esAdmin);

 await cargarPerfiles();
 await cargarLista();
 iniciarRealtime();

 const id=new URLSearchParams(location.search).get('torneo');
 if(id){
  await abrirTorneo(id,false);
 }
}

async function cargarLista(){
 if(!usuario)return;

 const {data,error}=await sb
  .from('torneos_v2')
  .select('*')
  .order('created_at',{ascending:false});

 if(error){
  console.error(error);
  return;
 }

 const rows=data||[];
 const activos=rows.filter(t=>!['finalizado','cancelado'].includes(t.estado));
 const historial=rows.filter(t=>['finalizado','cancelado'].includes(t.estado));

 document.getElementById('listaActivos').innerHTML=
  activos.length
   ? activos.map(cardTorneo).join('')
   : '<div class="notice">No hay torneos activos.</div>';

 document.getElementById('historialCount').textContent=`${historial.length} registro(s)`;

 document.getElementById('listaHistorial').innerHTML=
  historial.length
   ? historial.map(cardTorneo).join('')
   : '<div class="notice">No hay torneos en el historial.</div>';
}

function cardTorneo(t){
 let campeon='';

 if(t.estado==='finalizado'){
  if(t.campeon_equipo)campeon=` · Campeón: Equipo ${t.campeon_equipo}`;
  else if(t.campeon_jugador_id)campeon=` · Campeón: ${esc(nombreId(t.campeon_jugador_id))}`;
  else if(t.campeon_pareja_id)campeon=' · Campeón definido';
 }

 return `
  <div class="torneo-card">
   <div class="row">
    <div class="list-main">
     <div class="torneo-title">${esc(t.nombre)}</div>
     <div class="torneo-meta">${esc(modalidadTexto(t))} · ${t.limite_puntos} puntos${campeon}</div>
    </div>
    <span class="badge ${esc(t.estado)}">${esc(estadoTexto(t.estado))}</span>
   </div>
   <div class="torneo-actions">
    <button class="btn secondary" style="flex:1" onclick="abrirTorneo('${t.id}')">Ver / Gestionar</button>
    ${esAdmin&&['finalizado','cancelado'].includes(t.estado)
      ?`<button class="btn red" onclick="eliminarTorneo('${t.id}')">🗑️</button>`
      :''}
   </div>
  </div>`;
}

function volverLista(){
 torneoActual=null;
 document.getElementById('vistaDetalle').classList.add('hidden');
 document.getElementById('vistaLista').classList.remove('hidden');
 history.pushState({vista:'lista'},'',TORNEO_FILE);
 window.scrollTo({top:0,behavior:'instant'});
 cargarLista();
}

async function abrirTorneo(id,push=true){
 if(detalleCargando)return;
 detalleCargando=true;

 try{
  const {data,error}=await sb
   .from('torneos_v2')
   .select('*')
   .eq('id',id)
   .maybeSingle();

  if(error)throw error;
  if(!data)throw new Error('No se encontró el torneo.');

  torneoActual=data;

  document.getElementById('vistaLista').classList.add('hidden');
  document.getElementById('vistaDetalle').classList.remove('hidden');

  if(push){
   history.pushState(
    {vista:'torneo',torneo:id},
    '',
    `${TORNEO_FILE}?torneo=${encodeURIComponent(id)}`
   );
  }

  await renderDetalle();
  window.scrollTo({top:0,behavior:'instant'});
 }catch(e){
  errorMsg(e);
 }finally{
  detalleCargando=false;
 }
}

async function refrescarDetalle(){
 if(!torneoActual?.id)return;
 await abrirTorneo(torneoActual.id,false);
}

 renderAcciones();

  .from('torneo_v2_parejas')
  .select('*')
  .eq('torneo_id',torneoActual.id)
  .order('posicion');

 if(error)throw error;
 return data||[];

function pairText(p){
 if(!p)return 'Esperando…';
 return `${nombreId(p.jugador1_id)} & ${nombreId(p.jugador2_id)}`;
}

async function renderParejas(){
 const content=document.getElementById('detalleContent');

 const [participantes,parejas]=await Promise.all([

 if(torneoActual.estado==='inscripciones'){
  html+=await renderInscripciones(participantes);
 }

 html+=await renderParejasConfirmadas(participantes,parejas);

 if(torneoActual.estado==='en_curso' || torneoActual.estado==='finalizado'){
  if(['suizo','todos_contra_todos'].includes(torneoActual.sistema_parejas)){

  html+=`
   <div class="notice info">

    Administración puede reabrir o iniciar la competencia.
   </div>`;
 }

 content.innerHTML=html;
}

async function renderParejasConfirmadas(participantes,parejas){
 const paired=new Set();
 parejas.forEach(p=>{
  paired.add(p.jugador1_id);
  paired.add(p.jugador2_id);
 });

 const libres=participantes.filter(p=>!paired.has(p.jugador_id));
 const miPareja=parejas.find(p=>p.jugador1_id===perfil?.id||p.jugador2_id===perfil?.id);

 let solicitudes=[];

 if(torneoActual.estado==='inscripciones'){
  const {data}=await sb
   .from('torneo_v2_solicitudes_pareja')
   .select('*')
   .eq('torneo_id',torneoActual.id)
   .eq('estado','pendiente')
   .order('created_at');

  solicitudes=data||[];
 }

 const entrantes=solicitudes.filter(s=>s.invitado_id===perfil?.id);
 const miPendiente=solicitudes.find(s=>s.solicitante_id===perfil?.id);

 return `
  <div class="card">
   <div class="section-title">
    <span>🤝 Parejas confirmadas</span>
    <span class="small">${parejas.length} pareja(s)</span>
   </div>

   <div class="pair-grid">
    ${parejas.length
      ?parejas.map((p,i)=>`
       <div class="pair-card">
        <div class="row">
         <strong>Pareja ${i+1}</strong>
         ${esAdmin&&['inscripciones','cerrado'].includes(torneoActual.estado)
          ?`<button class="btn red sm" onclick="eliminarPareja('${p.id}')">🗑</button>`
          :''}
        </div>
        <div class="pair-names">${esc(pairText(p))}</div>
       </div>`).join('')
      :'<div class="small">Todavía no hay parejas formadas.</div>'}

   ${torneoActual.estado==='inscripciones'&&!miPareja?`
    <div style="margin-top:14px">
     <div class="section-title" style="font-size:.9rem">
      <span>Elegir compañero</span>
     </div>

     ${miPendiente
       ?`<div class="notice">Solicitud enviada a <strong>${esc(nombreId(miPendiente.invitado_id))}</strong>. Esperando respuesta.</div>`
       :`
        <div class="form-grid">
         <select id="miCompanero">
          <option value="">Seleccionar compañero…</option>
          ${libres
            .filter(x=>x.jugador_id!==perfil?.id)

            .join('')}

         <button class="btn green" onclick="solicitarPareja()">Enviar solicitud</button>
        </div>`}

     ${entrantes.map(s=>`
      <div class="notice info" style="margin-top:9px">

        <div class="actions">
         <button class="btn green sm" onclick="responderPareja('${s.id}',true)">Aceptar</button>
         <button class="btn red sm" onclick="responderPareja('${s.id}',false)">Rechazar</button>
        </div>
       </div>
      </div>`).join('')}
    </div>
   `:''}

   ${esAdmin&&['inscripciones','cerrado'].includes(torneoActual.estado)?`
    <div style="margin-top:14px">
     <div class="section-title" style="font-size:.9rem"><span>🛠 Crear pareja como administrador</span></div>
     <div class="form-grid">

async function renderEquipoAB(){
 const content=document.getElementById('detalleContent');

 const [participantes,membresias]=await Promise.all([
  obtenerParticipantes(),
  sb.from('torneo_v2_equipo_ab').select('*').eq('torneo_id',torneoActual.id)
   .then(r=>{if(r.error)throw r.error;return r.data||[]})
 ]);

 let html=content.innerHTML.includes('champion')?content.innerHTML:'';

 if(torneoActual.estado==='inscripciones'){
  html+=await renderInscripciones(participantes);

 if(['inscripciones','cerrado'].includes(torneoActual.estado)&&esAdmin){
  html+=renderConfigAB(participantes,membresias);

 if(membresias.length){

   </div>

   <button class="btn green" style="width:100%;margin-top:10px" onclick="guardarEquiposAB()">Guardar equipos y líderes</button>
  </div>`;

function actualizarLideresAB(){
 const selects=[...document.querySelectorAll('.abSide')];
 const a=selects.filter(x=>x.value==='A').map(x=>x.dataset.player);
 const b=selects.filter(x=>x.value==='B').map(x=>x.dataset.player);

 const fill=(id,ids)=>{
  const el=document.getElementById(id);
  if(!el)return;
  const current=el.value||el.dataset.current||'';
  el.innerHTML='<option value="">Seleccionar líder…</option>'+
   ids.map(pid=>`<option value="${pid}" ${pid===current?'selected':''}>${esc(nombreId(pid))}</option>`).join('');
 };

 fill('liderA',a);
 fill('liderB',b);
}

}

async function renderLineupAB(membresias){
 if(torneoActual.estado!=='en_curso')return '';

 const liderA=membresias.find(x=>x.lado==='A'&&x.es_lider)?.jugador_id;
 const liderB=membresias.find(x=>x.lado==='B'&&x.es_lider)?.jugador_id;
 const puedeA=esAdmin||perfil?.id===liderA;
 const puedeB=esAdmin||perfil?.id===liderB;

 if(!puedeA&&!puedeB)return '';

 const a=membresias.filter(x=>x.lado==='A');
 const b=membresias.filter(x=>x.lado==='B');

 const panel=(lado,rows)=>`
  <div class="lineup-card ${lado.toLowerCase()}">
   <h4>${lado==='A'?'🔵':'🟢'} Equipo ${lado}</h4>
   <label>Jugador 1</label>
   <select id="lineup${lado}1">
    <option value="">Seleccionar…</option>
    ${rows.map(x=>`<option value="${x.jugador_id}">${esc(nombreId(x.jugador_id))}</option>`).join('')}
   </select>
   <label style="margin-top:8px">Jugador 2</label>
   <select id="lineup${lado}2">
    <option value="">Seleccionar…</option>
    ${rows.map(x=>`<option value="${x.jugador_id}">${esc(nombreId(x.jugador_id))}</option>`).join('')}
   </select>
   <button class="btn green" style="width:100%;margin-top:9px" onclick="guardarLineupAB('${lado}')">Guardar pareja ${lado}</button>
  </div>`;

 return `
  <div class="card">
   <div class="section-title">
    <span>🤝 Parejas para la próxima partida</span>
    <span class="small">Meta: ${torneoActual.meta_victorias} victorias</span>
   </div>
   <div class="lineup-grid">
    ${puedeA?panel('A',a):''}
    ${puedeB?panel('B',b):''}
   </div>
  </div>`;
}

async function guardarLineupAB(lado){
 const a=document.getElementById(`lineup${lado}1`)?.value;
 const b=document.getElementById(`lineup${lado}2`)?.value;

 if(!a||!b||a===b){
  alert('Selecciona dos jugadores distintos.');
  return;
 }

 try{
  await rpc('torneo_v2_guardar_pareja_ab',{
   p_torneo_id:torneoActual.id,
   p_lado:lado,
   p_jugador1_id:a,
   p_jugador2_id:b
  });
  await refrescarDetalle();
 }catch(e){errorMsg(e)}
}

/* ============================================================
   ROTANDO FRENTES
   ============================================================ */

async function renderRotando(){
 const content=document.getElementById('detalleContent');
 const participantes=await obtenerParticipantes();

 let html=content.innerHTML.includes('champion')?content.innerHTML:'';

 if(torneoActual.estado==='inscripciones'){
  html+=await renderInscripciones(participantes);
  html+=`
   <div class="notice info">
    <strong>🔄 Regla de Rotando Frentes</strong><br>
    Cada jugador jugará exactamente una partida como compañero de cada uno de los demás.
    El jugador con más partidas ganadas será campeón.
   </div>`;
 }

 if(torneoActual.estado==='cerrado'){
  html+=`
   <div class="notice info">
    ${participantes.length} jugadores listos.
    Para generar todas las rotaciones, la cantidad debe ser 4, 5, 8, 9, 12, 13…
   </div>`;
 }

 if(torneoActual.estado==='en_curso'||torneoActual.estado==='finalizado'){
  html+=await renderTablaRotando();
  html+=await renderRondas(null);
 }

 content.innerHTML=html;
}

/* ============================================================
   RONDAS / PARTIDAS COMUNES
   ============================================================ */

async function obtenerPartidas(){
 const {data,error}=await sb
  .from('torneo_v2_partidas')
  .select('*')
  .eq('torneo_id',torneoActual.id)
  .order('numero');

 if(error)throw error;
 return data||[];
}

async function renderRondas(parejasPre=null){
 const [rondas,partidas,parejas]=await Promise.all([
  sb.from('torneo_v2_rondas').select('*').eq('torneo_id',torneoActual.id).order('numero')
   .then(r=>{if(r.error)throw r.error;return r.data||[]}),
  sb.from('torneo_v2_partidas').select('*').eq('torneo_id',torneoActual.id).order('created_at')
   .then(r=>{if(r.error)throw r.error;return r.data||[]}),
  torneoActual.modalidad==='parejas'
   ?(parejasPre?Promise.resolve(parejasPre):cargarParejas())
   :Promise.resolve([])
 ]);

 // Cargar jugadores solo si existen partidas.
 let rowsJugadores=[];
 if(partidas.length){
  const {data,error}=await sb
   .from('torneo_v2_partida_jugadores')
   .select('*')
   .in('partida_id',partidas.map(x=>x.id));

  if(!error)rowsJugadores=data||[];
 }

 const parejaMap=new Map((parejas||[]).map(p=>[p.id,p]));
 const playersByMatch=new Map();

 rowsJugadores.forEach(x=>{
  if(!playersByMatch.has(x.partida_id))playersByMatch.set(x.partida_id,[]);
  playersByMatch.get(x.partida_id).push(x);
 });

 if(!rondas.length)return '';

 const sideText=(partida,lado)=>{
  const pairId=lado===1?partida.pareja_a_id:partida.pareja_b_id;
  if(pairId){
   const p=parejaMap.get(pairId);
   return p?pairText(p):'Pareja';
  }

  const rows=(playersByMatch.get(partida.id)||[])
   .filter(x=>x.lado===lado)
   .sort((a,b)=>a.posicion-b.posicion);

  if(rows.length){
   return rows.map(x=>nombreId(x.jugador_id)).join(' & ');
  }

  return 'Esperando…';
 };

 const puedeAbrir=(partida)=>{
  if(esAdmin)return true;

  const rows=playersByMatch.get(partida.id)||[];
  if(rows.some(x=>x.jugador_id===perfil?.id))return true;

  const pa=parejaMap.get(partida.pareja_a_id);
  const pb=parejaMap.get(partida.pareja_b_id);

  return [pa,pb].some(p=>
   p&&(p.jugador1_id===perfil?.id||p.jugador2_id===perfil?.id)
  );
 };

 return `
  <div class="card">
   <div class="section-title">
    <span>🏆 Cuadro / Rondas</span>
    <span class="small">${partidas.length} partida(s)</span>
   </div>

   <div class="rounds">
    ${rondas.map(r=>{
     const ms=partidas.filter(p=>p.ronda_id===r.id).sort((a,b)=>a.numero-b.numero);

     return `
      <div class="round">
       <h3>${esc(r.nombre)}</h3>

       ${ms.length?ms.map(p=>{
        const a=sideText(p,1);
        const b=sideText(p,2);
        const winA=p.estado==='finalizada'&&p.ganador_lado===1;
        const winB=p.estado==='finalizada'&&p.ganador_lado===2;

        let action='';

        if(p.estado==='pendiente' && a!=='Esperando…' && b!=='Esperando…'){
         action=puedeAbrir(p)
          ?`<button class="btn amber" onclick="abrirPartida('${p.id}')">🎲 ${esAdmin?'Abrir mesa':'Iniciar mi mesa'}</button>`
          :`<div class="small center">Esperando a administración o a los jugadores de esta partida.</div>`;
        }

        if(p.estado==='en_curso'&&p.mesa_id){
         action=`<button class="btn primary" onclick="irMesa('${p.mesa_id}')">🎯 Ver mesa</button>`;
        }

        if(p.estado==='finalizada'){
         action='<div class="small center">✅ Partida finalizada</div>';
        }

        if(p.estado==='bye'){
         action='<div class="small center">Descanso / Bye</div>';
        }

        return `
         <div class="match">
          <div class="match-head">
           <div class="match-number">Partida #${p.numero}</div>
           <div class="match-state">${esc(p.estado)}</div>
          </div>
          <div class="match-grid">
           <div class="side ${winA?'winner':''}">
            <div class="side-name">${esc(a)}</div>
            <div class="side-score">${p.estado==='finalizada'?p.puntos_a:''}</div>
           </div>
           <div class="vs">VS</div>
           <div class="side ${winB?'winner':''}">
            <div class="side-name">${esc(b)}</div>
            <div class="side-score">${p.estado==='finalizada'?p.puntos_b:''}</div>
           </div>
          </div>
          <div class="match-action">${action}</div>
         </div>`;
       }).join(''):'<div class="small">Sin partidas.</div>'}
      </div>`;
    }).join('')}
   </div>
  </div>`;
}

async function abrirPartida(id){
 try{
  const d=await rpc('torneo_v2_abrir_partida',{p_partida_id:id});
  if(!d?.mesa_id)throw new Error('No se recibió la mesa.');
  irMesa(d.mesa_id);
 }catch(e){errorMsg(e)}
}

function irMesa(mesaId){
 const retorno=`${TORNEO_FILE}?torneo=${encodeURIComponent(torneoActual.id)}`;
 sessionStorage.setItem('mesa_return_url',retorno);
 sessionStorage.setItem('mesa_return_mesa_id',String(mesaId));

 location.href=
  `mesa.html?id=${encodeURIComponent(mesaId)}&return=${encodeURIComponent(retorno)}`;
}

/* ============================================================
   CREAR
   ============================================================ */

function actualizarCrear(){
 const m=document.getElementById('crearModalidad').value;
 const s=document.getElementById('crearSistema').value;

 document.getElementById('crearParejasConfig').classList.toggle('hidden',m!=='parejas');
 document.getElementById('crearSuizoConfig').classList.toggle('hidden',!(m==='parejas'&&s==='suizo'));
 document.getElementById('crearABConfig').classList.toggle('hidden',m!=='equipo_ab');
 document.getElementById('crearRotandoInfo').classList.toggle('hidden',m!=='rotando_frente');
}

document.getElementById('crearModalidad').addEventListener('change',actualizarCrear);
document.getElementById('crearSistema').addEventListener('change',actualizarCrear);

document.getElementById('formCrear').addEventListener('submit',async e=>{
 e.preventDefault();
 if(!esAdmin)return;

 try{
  const modalidad=document.getElementById('crearModalidad').value;
  const sistema=modalidad==='parejas'?document.getElementById('crearSistema').value:null;

  const d=await rpc('torneo_v2_crear',{
   p_nombre:document.getElementById('crearNombre').value,
   p_modalidad:modalidad,
   p_sistema_parejas:sistema,
   p_limite_puntos:Number(document.getElementById('crearLimite').value||200),
   p_rondas_suizo:Number(document.getElementById('crearRondas').value||5),
   p_meta_victorias:Number(document.getElementById('crearMeta').value||16),
   p_descripcion:document.getElementById('crearDescripcion').value||null
  });

  e.target.reset();
  document.getElementById('crearLimite').value=200;
  document.getElementById('crearRondas').value=5;
  document.getElementById('crearMeta').value=16;
  actualizarCrear();

  await cargarLista();
  if(d?.torneo_id)await abrirTorneo(d.torneo_id);
 }catch(err){
  errorMsg(err);
 }
});

/* ============================================================
   REALTIME
   No escuchamos MANOS.
   El trigger SQL actualiza torneo_v2_partidas únicamente cuando
   el resultado de una partida cambia.
   ============================================================ */

function programarRefresh(){
 clearTimeout(realtimeTimer);

 realtimeTimer=setTimeout(async()=>{
  if(torneoActual?.id){
   await refrescarDetalle();
  }else{
   await cargarLista();
  }
 },250);
}

function iniciarRealtime(){
 if(canal)return;

 try{
  canal=sb
   .channel('torneos-v2-ui')
   .on('postgres_changes',{event:'*',schema:'public',table:'torneos_v2'},programarRefresh)
   .on('postgres_changes',{event:'*',schema:'public',table:'torneo_v2_participantes'},programarRefresh)
   .on('postgres_changes',{event:'*',schema:'public',table:'torneo_v2_parejas'},programarRefresh)
   .on('postgres_changes',{event:'*',schema:'public',table:'torneo_v2_solicitudes_pareja'},programarRefresh)
   .on('postgres_changes',{event:'*',schema:'public',table:'torneo_v2_equipo_ab'},programarRefresh)
   .on('postgres_changes',{event:'*',schema:'public',table:'torneo_v2_rondas'},programarRefresh)
   .on('postgres_changes',{event:'*',schema:'public',table:'torneo_v2_partidas'},programarRefresh)
   .on('postgres_changes',{event:'*',schema:'public',table:'torneo_v2_partida_jugadores'},programarRefresh)
   .subscribe(status=>console.log('[TORNEOS V2] Realtime:',status));
 }catch(e){
  console.warn('[TORNEOS V2] Realtime no disponible:',e);
 }
}

window.addEventListener('popstate',async()=>{
 const id=new URLSearchParams(location.search).get('torneo');
 if(id){
  await abrirTorneo(id,false);
 }else{
  torneoActual=null;
  document.getElementById('vistaDetalle').classList.add('hidden');
  document.getElementById('vistaLista').classList.remove('hidden');
 }
});

actualizarCrear();
inicializar();
</script>
