<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Dominó y Romo — Torneos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b1120;--card:#152238;--sub:#0d1726;--input:#1e2d4a;--border:#263859;--text:#fff;--muted:#8e9bb0;--blue:#2563eb;--green:#10b981;--red:#ef4444;--amber:#f59e0b;--cyan:#38bdf8}
html.light-mode{--bg:#f1f5f9;--card:#fff;--sub:#f8fafc;--input:#f8fafc;--border:#cbd5e1;--text:#0f172a;--muted:#64748b;--cyan:#0284c7}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);padding:16px 12px}
.container{max-width:900px;margin:auto;display:flex;flex-direction:column;gap:14px}
header{text-align:center;padding:4px 0} header img{width:130px} h1{font-size:1.8rem;color:var(--cyan);font-weight:900} .subtitle{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} .form{display:flex;flex-direction:column;gap:10px}
label{font-size:.78rem;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text)} textarea{min-height:80px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff} .btn.secondary{background:var(--input);color:var(--text);border:1px solid var(--border)} .btn.green{background:var(--green)} .btn.red{background:var(--red)} .btn.amber{background:var(--amber);color:#111}
.btn:disabled{opacity:.6;cursor:not-allowed} .small{font-size:.78rem;color:var(--muted)} .hidden{display:none!important}
.badge{padding:4px 8px;border-radius:999px;font-size:.7rem;font-weight:800;white-space:nowrap}
.borrador{background:#334155;color:#e2e8f0} .inscripciones{background:#164e63;color:#a5f3fc} .cerrado{background:#4c1d95;color:#ddd6fe} .en_curso{background:#065f46;color:#6ee7b7} .finalizado{background:#3f3f46;color:#d4d4d8} .cancelado{background:#7f1d1d;color:#fecaca}
.torneo-item,.match,.request{background:var(--sub);border:1px solid var(--border);border-radius:12px;padding:13px;margin-top:9px}
.match-grid{display:grid;grid-template-columns:1fr 70px 1fr;gap:10px;align-items:center} .team{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--card)} .team.win{border-color:#10b981}
.vs{text-align:center;font-weight:900;color:var(--muted)} .players{font-size:.8rem;line-height:1.45;margin-top:4px}
.bracket{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px} .round{min-width:250px;flex:1} .round h3{font-size:.9rem;color:var(--cyan);margin-bottom:6px}
.notice{padding:10px 12px;border-radius:10px;background:var(--sub);border:1px solid var(--border);font-size:.82rem;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions .btn{flex:1;min-width:150px}
.table{width:100%;border-collapse:collapse;font-size:.8rem} .table th,.table td{padding:7px;border-bottom:1px solid var(--border)} .table th{color:var(--muted);font-size:.68rem;text-transform:uppercase}
@media(max-width:700px){.grid{grid-template-columns:1fr} .match-grid{grid-template-columns:1fr} .round{min-width:230px}}
</style>
<script>
(() => {
 if ((localStorage.getItem('theme')||'dark') === 'light') {
   document.documentElement.classList.add('light-mode');
 }
})();
</script>
</head>
<body>
<div class="container">

<header>
 <img src="logo.png" alt="Logo">
 <h1>🏆 Torneos</h1>
 <div class="subtitle">Gestión y seguimiento de competencias</div>
</header>

<div class="row">
 <button class="btn secondary" onclick="location.href='lobby.html'">← Volver al Lobby</button>
 <button class="btn secondary" onclick="cargarTodo()">🔄 Actualizar</button>
</div>

<div id="estadoSesion" class="card"></div>

<div class="card" id="crearCard">
 <div class="row"><h2 style="font-size:1.05rem">➕ Crear torneo</h2><span class="small">Administración</span></div>

 <form id="formCrear" class="form" style="margin-top:10px">

  <div class="grid">
   <div>
    <label>Nombre</label>
    <input id="nombre" required placeholder="Ej. Torneo Jueves">
   </div>
   <div>
    <label>Puntos por partida</label>
    <input id="limite" type="number" min="50" step="50" value="200" required>
   </div>
  </div>

  <div>
   <label>Modalidad</label>
   <select id="modalidad" onchange="actualizarConfiguracionModalidad()">
    <option value="parejas">👫 Por Parejas</option>
    <option value="equipo_ab">🔵🔴 Equipo A vs B</option>
    <option value="rotando_frente">🔄 Rotando Frente</option>
    <option value="muerte_subita">☠️ Muerte Súbita</option>
   </select>
  </div>

  <div id="configParejas" class="notice">
   <strong>🏆 Parejas Fijas</strong>
   <div class="grid" style="margin-top:8px">
    <div>
     <label>Sistema de competencia</label>
     <select id="sistemaParejas" onchange="actualizarConfiguracionModalidad()">
      <option value="eliminacion_directa">Eliminación Directa</option>
      <option value="suizo">Sistema Suizo</option>
      <option value="todos_contra_todos">Todos contra Todos</option>
     </select>
    </div>
    <div id="rondasSuizoBox">
     <label>Rondas suizas</label>
     <input id="rondasSuizo" type="number" min="1" max="20" value="5">
    </div>
   </div>
   <div id="descripcionSistema" class="small" style="margin-top:7px"></div>
  </div>

  <div class="grid">
   <div><label>Fecha de inicio</label><input id="fecha" type="datetime-local"></div>
   <div><label>Estado inicial</label>
    <select id="estado">
     <option value="inscripciones">Inscripciones abiertas</option>
     <option value="borrador">Borrador</option>
    </select>
   </div>
  </div>

  <div>
   <label>Descripción</label>
   <textarea id="descripcion" placeholder="Reglas o detalles"></textarea>
  </div>

  <button class="btn green" type="submit">Crear torneo</button>
 </form>
</div>

<div class="card">
 <div class="row"><h2 style="font-size:1.05rem">📋 Torneos</h2><span id="contador" class="small"></span></div>
 <div id="listaTorneos"></div>
</div>

<div class="card hidden" id="detalleCard">

 <div class="row">
  <div>
   <h2 id="detalleTitulo" style="font-size:1.2rem"></h2>
   <div id="detalleSub" class="small"></div>
  </div>
  <span id="detalleEstado" class="badge"></span>
 </div>

 <div id="accionesTorneo" class="actions"></div>

 <div id="editarBox" class="card hidden" style="margin-top:12px;background:var(--sub)">
  <div class="row"><h3 style="font-size:.95rem">✏️ Editar torneo</h3><button class="btn secondary" onclick="cerrarEditor()">Cerrar</button></div>

  <form id="formEditar" class="form" style="margin-top:10px">
   <div class="grid">
    <div><label>Nombre</label><input id="editNombre" required></div>
    <div><label>Puntos</label><input id="editLimite" type="number" min="50" step="50" required></div>
   </div>

   <div>
    <label>Sistema de parejas</label>
    <select id="editSistema">
     <option value="eliminacion_directa">🏆 Eliminación Directa</option>
     <option value="suizo">♟️ Sistema Suizo</option>
     <option value="todos_contra_todos">🔁 Todos contra Todos</option>
    </select>
   </div>

   <div id="editRondasBox">
    <label>Rondas suizas</label>
    <input id="editRondas" type="number" min="1" max="20" value="5">
   </div>

   <div class="grid">
    <div><label>Fecha de inicio</label><input id="editFecha" type="datetime-local"></div>
    <div><label>Estado</label><input id="editEstado" disabled></div>
   </div>

   <div><label>Descripción</label><textarea id="editDescripcion"></textarea></div>

   <button class="btn green" type="submit">💾 Guardar cambios</button>
  </form>
 </div>

 <div id="inscripcionBox" class="card" style="margin-top:12px;padding:12px;background:var(--sub)">
  <div class="row"><h3 style="font-size:.95rem">👥 Inscripciones</h3><span id="inscripcionResumen" class="small"></span></div>
  <div id="accionesInscripcion" style="margin-top:10px"></div>

  <div id="adminInscripcion" class="hidden" style="margin-top:10px">
   <div class="grid">
    <div><label>Inscribir jugador como administrador</label><select id="jugadorSeleccionado"></select></div>
    <div style="display:flex;align-items:end"><button class="btn green" id="btnAgregarJugador">➕ Inscribir</button></div>
   </div>
  </div>

  <div id="listaParticipantes" style="margin-top:10px"></div>
  <div id="solicitudesPareja" style="margin-top:12px"></div>
  <div id="parejasConfirmadas" style="margin-top:12px"></div>
 </div>

 <div id="standingsBox" class="hidden" style="margin-top:12px;padding:12px;background:var(--sub);border-radius:12px;border:1px solid var(--border)">
  <h3 style="font-size:1rem;margin-bottom:8px">📊 Tabla de posiciones</h3>
  <div id="standings"></div>
 </div>

 <div id="bracketBox" class="hidden" style="margin-top:12px">
  <h3 style="font-size:1rem;margin-bottom:8px">🏆 Cuadro / Rondas</h3>
  <div class="bracket" id="bracket"></div>
 </div>

</div>
</div>

<script>
const SUPABASE_URL = 'https://kzbslfwupzwczmjqfjem.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YnNsZnd1cHp3Y3ptanFmamVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDI1MzksImV4cCI6MjEwMjcxODUzOX0.qeeh2FV3zKRet-jRMVvJUwBm9jYHsLbWSYWIao574qc';
const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let usuario = null;
let perfil = null;
let esAdmin = false;
let torneoActual = null;
let torneos = [];

function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function nombrePerfil(p){
 return p?.username || p?.nombre_completo || 'Jugador';
}

function modalidadTexto(m){
 return {parejas:'👫 Por Parejas',equipo_ab:'🔵🔴 Equipo A vs B',rotando_frente:'🔄 Rotando Frente',muerte_subita:'☠️ Muerte Súbita'}[m]||m;
}

function sistemaParejasTexto(s){
 return {eliminacion_directa:'🏆 Eliminación Directa',suizo:'♟️ Sistema Suizo',todos_contra_todos:'🔁 Todos contra Todos'}[s]||'Parejas Fijas';
}

function sistemaParejasDescripcion(s){
 if(s==='eliminacion_directa') return 'La pareja que pierde queda eliminada inmediatamente.';
 if(s==='suizo') return 'Varias rondas por victorias; una derrota no elimina a la pareja.';
 if(s==='todos_contra_todos') return 'Cada pareja juega contra todas las demás y el campeón sale de la tabla general.';
 return '';
}

function estadoTexto(e){
 return {borrador:'Borrador',inscripciones:'Inscripciones',cerrado:'Inscripciones cerradas',en_curso:'En curso',finalizado:'Finalizado',cancelado:'Cancelado'}[e]||e;
}

function actualizarConfiguracionModalidad(){
 const modalidad=document.getElementById('modalidad')?.value;
 const box=document.getElementById('configParejas');
 const rounds=document.getElementById('rondasSuizoBox');
 const desc=document.getElementById('descripcionSistema');
 if(!box)return;
 if(modalidad!=='parejas'){box.classList.add('hidden');return;}
 box.classList.remove('hidden');
 const sistema=document.getElementById('sistemaParejas')?.value||'eliminacion_directa';
 rounds.classList.toggle('hidden',sistema!=='suizo');
 desc.textContent=sistemaParejasDescripcion(sistema);
}

function actualizarEditorSistema(){
 const sistema=document.getElementById('editSistema')?.value;
 document.getElementById('editRondasBox')?.classList.toggle('hidden',sistema!=='suizo');
}

async function inicializar(){
 const {data:{session}}=await sbClient.auth.getSession();

 if(!session){
   document.getElementById('estadoSesion').innerHTML='<div class="notice">Debes iniciar sesión para gestionar torneos.</div>';
   document.getElementById('crearCard').classList.add('hidden');
 }else{
   usuario=session.user;
   const {data:p}=await sbClient.from('perfiles').select('id,username,nombre_completo,rol').eq('auth_user_id',session.user.id).single();
   perfil=p||null;
   const rol=(p?.rol||'jugador').toString().toUpperCase();
   esAdmin=['ADMIN','SUPER_ADMIN'].includes(rol);
   document.getElementById('estadoSesion').innerHTML=
     `<div class="row"><div><strong>👤 ${esc(nombrePerfil(p)||session.user.email)}</strong><div class="small">Rol: ${esc(rol)}</div></div><span class="badge ${esAdmin?'en_curso':'inscripciones'}">${esAdmin?'ADMINISTRADOR':'JUGADOR'}</span></div>`;
   document.getElementById('crearCard').classList.toggle('hidden',!esAdmin);
 }
 actualizarConfiguracionModalidad();
 await cargarTodo();
 const id=new URLSearchParams(location.search).get('torneo');
 if(id) await abrirTorneo(id);
}

async function cargarTodo(){
 const {data,error}=await sbClient.from('torneos').select('*').order('fecha_inicio',{ascending:true,nullsFirst:false});
 if(error){
   console.error(error);
   document.getElementById('listaTorneos').innerHTML='<div class="notice">No se pudieron cargar los torneos: '+esc(error.message)+'</div>';
   return;
 }
 torneos=data||[];
 document.getElementById('contador').textContent=`${torneos.length} registro(s)`;
 document.getElementById('listaTorneos').innerHTML=
  torneos.length?torneos.map(t=>`
   <div class="torneo-item">
    <div class="row">
     <div>
      <strong>${esc(t.nombre)}</strong>
      <div class="small">
       ${modalidadTexto(t.modalidad)}
       ${t.modalidad==='parejas'?' · '+sistemaParejasTexto(t.sistema_parejas):''}
       · ${t.limite_puntos} puntos
      </div>
     </div>
     <span class="badge ${t.estado}">${estadoTexto(t.estado)}</span>
    </div>
    ${t.fecha_inicio?`<div class="small" style="margin-top:5px">📅 ${new Date(t.fecha_inicio).toLocaleString('es-DO')}</div>`:''}
    <div style="margin-top:9px">
     <button class="btn secondary" onclick="abrirTorneo('${t.id}')">Ver / gestionar</button>
    </div>
   </div>`).join('')
  :'<div class="notice">Todavía no hay torneos creados.</div>';
}

async function abrirTorneo(id){
 const {data,error}=await sbClient.from('torneos').select('*').eq('id',id).single();
 if(error||!data){alert('No se encontró el torneo.');return;}
 torneoActual=data;
 history.replaceState(null,'','torneos.html?torneo='+encodeURIComponent(id));

 document.getElementById('detalleCard').classList.remove('hidden');
 document.getElementById('detalleTitulo').textContent=torneoActual.nombre;
 document.getElementById('detalleSub').textContent=
  modalidadTexto(torneoActual.modalidad)+
  (torneoActual.modalidad==='parejas'?' · '+sistemaParejasTexto(torneoActual.sistema_parejas): '')+
  ' · '+torneoActual.limite_puntos+' puntos';

 const st=document.getElementById('detalleEstado');
 st.className='badge '+torneoActual.estado;
 st.textContent=estadoTexto(torneoActual.estado);

 cerrarEditor();
 renderAcciones();
 await cargarParticipantes();
 await cargarParejas();
 await cargarTabla();
 await cargarBrackets();
}

function renderAcciones(){
 const a=document.getElementById('accionesTorneo');

 let html='';

 if(esAdmin){
  if(['borrador','inscripciones','cerrado'].includes(torneoActual.estado)){
   html+=`<button class="btn secondary" onclick="abrirEditor()">✏️ Editar torneo</button>`;
  }

  if(['borrador','inscripciones'].includes(torneoActual.estado)){
   html+=`<button class="btn amber" onclick="cerrarInscripciones()">🔒 Cerrar inscripciones</button>`;
  }

  if(torneoActual.estado==='cerrado'){
   html+=`<button class="btn green" onclick="abrirInscripciones()">🔓 Abrir inscripciones</button>`;
   if(torneoActual.modalidad==='parejas'){
    html+=`<button class="btn green" onclick="generarCuadro()">🏆 Generar torneo</button>`;
   }
  }

  if(torneoActual.estado==='inscripciones' && torneoActual.modalidad==='parejas'){
   html+=`<button class="btn green" onclick="generarCuadro()">🏆 Generar torneo</button>`;
  }

  if(torneoActual.estado==='en_curso' && torneoActual.sistema_parejas==='suizo'){
   html+=`<button class="btn amber" onclick="generarSiguienteRondaSuiza()">♟️ Siguiente ronda</button>`;
  }

  if(['borrador','inscripciones','cerrado','en_curso'].includes(torneoActual.estado)){
   html+=`<button class="btn red" onclick="cancelarTorneo()">🗑️ Cancelar torneo</button>`;
   html+=`<button class="btn red" onclick="finalizarTorneo()">⏹️ Finalizar torneo</button>`;
  }
 }

 a.innerHTML=html;
}

function abrirEditor(){
 if(!torneoActual)return;

 document.getElementById('editarBox').classList.remove('hidden');
 document.getElementById('editNombre').value=torneoActual.nombre||'';
 document.getElementById('editLimite').value=torneoActual.limite_puntos||200;
 document.getElementById('editSistema').value=torneoActual.sistema_parejas||'eliminacion_directa';
 document.getElementById('editRondas').value=torneoActual.rondas_objetivo||5;
 document.getElementById('editFecha').value=torneoActual.fecha_inicio
   ? new Date(torneoActual.fecha_inicio).toISOString().slice(0,16)
   : '';
 document.getElementById('editEstado').value=estadoTexto(torneoActual.estado);
 document.getElementById('editDescripcion').value=torneoActual.descripcion||'';
 actualizarEditorSistema();
}

function cerrarEditor(){
 document.getElementById('editarBox')?.classList.add('hidden');
}

document.getElementById('formEditar').addEventListener('submit',async e=>{
 e.preventDefault();

 let fecha=null;
 const fechaInput=document.getElementById('editFecha').value;
 if(fechaInput){
   const d=new Date(fechaInput);
   if(Number.isNaN(d.getTime())){alert('Fecha inválida.');return;}
   fecha=d.toISOString();
 }

 const payload={
  p_torneo_id:torneoActual.id,
  p_nombre:document.getElementById('editNombre').value.trim(),
  p_limite_puntos:parseInt(document.getElementById('editLimite').value,10)||200,
  p_fecha_inicio:fecha,
  p_descripcion:document.getElementById('editDescripcion').value.trim(),
  p_sistema_parejas:document.getElementById('editSistema').value,
  p_rondas_objetivo:parseInt(document.getElementById('editRondas').value,10)||5
 };

 const {data,error}=await sbClient.rpc('editar_torneo_admin',payload);

 if(error||data?.success===false){
   alert('No se pudo editar: '+(error?.message||data?.error||'Error desconocido'));
   return;
 }

 alert('✅ Torneo actualizado.');
 await cargarTodo();
 await abrirTorneo(torneoActual.id);
});

document.getElementById('formCrear').addEventListener('submit',async e=>{
 e.preventDefault();

 const nombre=document.getElementById('nombre').value.trim();
 const limite=parseInt(document.getElementById('limite').value,10)||200;
 const modalidad=document.getElementById('modalidad').value;
 const sistema=document.getElementById('sistemaParejas').value;
 const rondas=parseInt(document.getElementById('rondasSuizo').value,10)||5;
 const estado=document.getElementById('estado').value;
 const desc=document.getElementById('descripcion').value.trim();

 let fecha=null;
 const fv=document.getElementById('fecha').value;
 if(fv){
  const d=new Date(fv);
  if(Number.isNaN(d.getTime())){alert('Fecha inválida.');return;}
  fecha=d.toISOString();
 }

 const {data,error}=await sbClient.from('torneos').insert({
  nombre,modalidad,descripcion:desc||null,
  limite_puntos:limite,fecha_inicio:fecha,estado,
  creado_por:perfil?.id||null,
  configuracion:{},
  sistema_parejas:modalidad==='parejas'?sistema:'eliminacion_directa',
  rondas_objetivo:modalidad==='parejas'&&sistema==='suizo'?rondas:5
 }).select().single();

 if(error){
   console.error('[TORNEOS] Crear:',error);
   alert('No se pudo crear: '+error.message);
   return;
 }

 alert('✅ Torneo creado.');
 e.target.reset();
 document.getElementById('limite').value=200;
 document.getElementById('estado').value='inscripciones';
 document.getElementById('sistemaParejas').value='eliminacion_directa';
 document.getElementById('rondasSuizo').value=5;
 actualizarConfiguracionModalidad();

 await cargarTodo();
 await abrirTorneo(data.id);
});

async function cerrarInscripciones(){
 const ok=confirm('¿Cerrar las inscripciones? Los jugadores ya no podrán inscribirse ni cambiar pareja.');
 if(!ok)return;
 const {data,error}=await sbClient.rpc('cerrar_inscripciones_torneo_admin',{p_torneo_id:torneoActual.id});
 if(error||data?.success===false){alert('No se pudo cerrar: '+(error?.message||data?.error||'Error'));return;}
 await cargarTodo(); await abrirTorneo(torneoActual.id);
}

async function abrirInscripciones(){
 const {data,error}=await sbClient.rpc('abrir_inscripciones_torneo_admin',{p_torneo_id:torneoActual.id});
 if(error||data?.success===false){alert('No se pudo abrir: '+(error?.message||data?.error||'Error'));return;}
 await cargarTodo(); await abrirTorneo(torneoActual.id);
}

async function cancelarTorneo(){
 if(!confirm('¿Seguro que deseas cancelar este torneo? Esta acción cerrará el torneo.'))return;
 const {data,error}=await sbClient.rpc('cancelar_torneo_admin',{p_torneo_id:torneoActual.id});
 if(error||data?.success===false){alert('No se pudo cancelar: '+(error?.message||data?.error||'Error'));return;}
 await cargarTodo(); await abrirTorneo(torneoActual.id);
}

 if(error||data?.success===false){alert('No se pudo finalizar: '+(error?.message||data?.error||'Error'));return;}

async function cargarParticipantes(){
 const {data,error}=await sbClient
  .from('torneo_participantes')
  .select('id,jugador_id,estado,perfiles(username,nombre_completo,elo)')
  .eq('torneo_id',torneoActual.id)
  .order('created_at',{ascending:true});

 if(error){console.error(error);return;}

 const participants=data||[];
 document.getElementById('inscripcionResumen').textContent=`${participants.length} inscrito(s)`;

 const inscritos=new Set(
  participants.filter(p=>p.estado!=='retirado').map(p=>p.jugador_id)
 );

 const miId=perfil?.id||null;
 const estaInscrito=participants.some(p=>p.jugador_id===miId&&p.estado!=='retirado');

 let acciones='';

 if(torneoActual.estado==='inscripciones'&&!estaInscrito&&miId){
  acciones+=`<button class="btn green" style="width:100%" onclick="inscribirme()">🙋 Inscribirme</button>`;
 }

 if(torneoActual.estado==='inscripciones'&&estaInscrito){
  acciones+=`<button class="btn red" style="width:100%;margin-top:8px" onclick="retirarme()">🚪 Retirarme</button>`;
 }

 document.getElementById('accionesInscripcion').innerHTML=acciones;

 const adminBox=document.getElementById('adminInscripcion');
 adminBox.classList.toggle('hidden',!(esAdmin&&torneoActual.estado==='inscripciones'));

 if(esAdmin&&torneoActual.estado==='inscripciones'){
   const {data:players}=await sbClient
    .from('perfiles')
    .select('id,username,nombre_completo')
    .eq('estado','aprobado')
    .order('username');

   document.getElementById('jugadorSeleccionado').innerHTML=
    '<option value="">Seleccionar jugador...</option>'+
    (players||[])
     .filter(p=>!inscritos.has(p.id))
     .map(p=>`<option value="${p.id}">${esc(nombrePerfil(p))}</option>`)
     .join('');
 }

 document.getElementById('listaParticipantes').innerHTML=
  participants.length
   ? participants.map((p,i)=>`
      <div class="torneo-item">
       <div class="row">
        <strong>${i+1}. ${esc(nombrePerfil(p.perfiles))}</strong>
        <span class="small">Elo ${p.perfiles?.elo??1200} · ${esc(p.estado)}</span>
       </div>
      </div>`).join('')
   : '<div class="small">No hay jugadores inscritos.</div>';

 await cargarSolicitudes(participants,miId);
}

document.getElementById('btnAgregarJugador').addEventListener('click',async()=>{
 const jugador=document.getElementById('jugadorSeleccionado').value;
 if(!jugador)return alert('Selecciona un jugador.');

 const {data,error}=await sbClient.rpc(
  'inscribir_jugador_torneo_admin',
  {p_torneo_id:torneoActual.id,p_jugador_id:jugador}
 );

 if(error||data?.success===false){alert('No se pudo inscribir: '+(error?.message||data?.error||'Error'));return;}

});

async function cargarSolicitudes(participants,miId){
 const box=document.getElementById('solicitudesPareja');
 if(torneoActual.modalidad!=='parejas'||!miId){box.innerHTML='';return;}

 const {data,error}=await sbClient
  .from('torneo_solicitudes_pareja')
  .select(`
   id,solicitante_id,destinatario_id,estado,
   solicitante:solicitante_id(username,nombre_completo),
   destinatario:destinatario_id(username,nombre_completo)
  `)
  .eq('torneo_id',torneoActual.id)
  .order('created_at',{ascending:false});

 if(error){console.error(error);box.innerHTML='';return;}

 const recibidas=(data||[]).filter(s=>s.estado==='pendiente'&&s.destinatario_id===miId);
 const enviadas=(data||[]).filter(s=>s.estado==='pendiente'&&s.solicitante_id===miId);

 let html='';

 if(recibidas.length){
  html+=`<div class="notice"><strong>📨 Solicitudes recibidas</strong>
   ${recibidas.map(s=>`
    <div class="request">
     <div>${esc(nombrePerfil(s.solicitante))} quiere formar pareja contigo.</div>
     <div class="actions">
      <button class="btn green" onclick="responderSolicitud('${s.id}',true)">✅ Aceptar</button>
      <button class="btn red" onclick="responderSolicitud('${s.id}',false)">❌ Declinar</button>
     </div>
    </div>`).join('')}
  </div>`;
 }

 if(enviadas.length){
  html+=`<div class="notice" style="margin-top:8px"><strong>📤 Solicitudes enviadas</strong>
   ${enviadas.map(s=>`
    <div class="request">Esperando respuesta de <strong>${esc(nombrePerfil(s.destinatario))}</strong>.</div>
   `).join('')}
  </div>`;
 }

 if(torneoActual.estado==='inscripciones'){
  const miPareja=await obtenerParejaPropia(miId);

  if(!miPareja&&participants.some(p=>p.jugador_id===miId&&p.estado==='inscrito')){
   const {data:ocupadas}=await sbClient
    .from('torneo_equipo_jugadores')
    .select('jugador_id,torneo_equipos!inner(torneo_id,tipo)')
    .eq('torneo_equipos.torneo_id',torneoActual.id)
    .eq('torneo_equipos.tipo','pareja');

   const used=new Set((ocupadas||[]).map(x=>x.jugador_id));

   const opciones=participants
    .filter(p=>p.estado==='inscrito'&&p.jugador_id!==miId&&!used.has(p.jugador_id))
    .map(p=>`<option value="${p.jugador_id}">${esc(nombrePerfil(p.perfiles))}</option>`)
    .join('');

   if(opciones){
    html+=`
     <div class="notice" style="margin-top:8px">
      <strong>🤝 Elegir compañero</strong>
      <div class="small" style="margin-top:4px">El compañero debe aceptar la solicitud.</div>
      <select id="miCompanero" style="margin-top:8px">
       <option value="">Seleccionar compañero...</option>
       ${opciones}
      </select>
      <button class="btn green" style="width:100%;margin-top:8px" onclick="solicitarPareja()">📩 Enviar solicitud</button>
     </div>`;
   }
  }
 }

 box.innerHTML=html;
}

async function obtenerParejaPropia(miId){
 if(!miId)return null;

 const {data}=await sbClient
  .from('torneo_equipo_jugadores')
  .select('equipo_id,torneo_equipos!inner(id,torneo_id,tipo)')
  .eq('jugador_id',miId)
  .eq('torneo_equipos.torneo_id',torneoActual.id)
  .eq('torneo_equipos.tipo','pareja')
  .limit(1);

 return data?.[0]?.equipo_id||null;
}

async function solicitarPareja(){
 const comp=document.getElementById('miCompanero')?.value;
 if(!comp)return alert('Selecciona un compañero.');

 const {data,error}=await sbClient.rpc(
  'solicitar_pareja_torneo',
  {p_torneo_id:torneoActual.id,p_companero_id:comp}
 );

 if(error||data?.success===false){alert('No se pudo enviar: '+(error?.message||data?.error||'Error'));return;}

 alert('📩 Solicitud enviada.');
 await abrirTorneo(torneoActual.id);
}

  'responder_solicitud_pareja',

 );

 const {data,error}=await sbClient
  .from('torneo_equipos')
  .select(`
   id,nombre,posicion,
   torneo_equipo_jugadores(jugador_id,perfiles(username,nombre_completo))
  `)
  .eq('torneo_id',torneoActual.id)
  .eq('tipo','pareja')

async function cargarTabla(){
 const box=document.getElementById('standingsBox');
 const cont=document.getElementById('standings');

 if(!['suizo','todos_contra_todos'].includes(torneoActual.sistema_parejas)){
  box.classList.add('hidden');
  return;
 }

 const {data:teams}=await sbClient
  .from('torneo_equipos')
  .select('id,nombre,posicion,torneo_equipo_jugadores(jugador_id,perfiles(username,nombre_completo))')
  .eq('torneo_id',torneoActual.id)
  .eq('tipo','pareja')
  .order('posicion');

 const {data:matches}=await sbClient
  .from('torneo_enfrentamientos')
  .select('id,estado,ganador_id,puntos_ganador,puntos_perdedor,torneo_enfrentamiento_equipos(equipo_id,lado)')
  .eq('torneo_id',torneoActual.id)
  .eq('estado','finalizado');

 const stats={};
 (teams||[]).forEach(t=>stats[t.id]={team:t,pj:0,pg:0,pp:0,pf:0,pc:0});

 (matches||[]).forEach(m=>{
  (m.torneo_enfrentamiento_equipos||[]).forEach(te=>{
   const s=stats[te.equipo_id]; if(!s)return;
   s.pj++;
   if(m.ganador_id===te.equipo_id){s.pg++;s.pf+=m.puntos_ganador||0;s.pc+=m.puntos_perdedor||0;}
   else{s.pp++;s.pf+=m.puntos_perdedor||0;s.pc+=m.puntos_ganador||0;}
  });
 });

 const rows=Object.values(stats)
  .map(s=>({...s,dif:s.pf-s.pc}))
  .sort((a,b)=>b.pg-a.pg||b.dif-a.dif||b.pf-a.pf||(a.team.posicion||999)-(b.team.posicion||999));

 cont.innerHTML=`
  <table class="table">
   <thead><tr><th>#</th><th>Pareja</th><th>PJ</th><th>PG</th><th>PP</th><th>Dif.</th></tr></thead>
   <tbody>
    ${rows.map((s,i)=>{
     const n=(s.team.torneo_equipo_jugadores||[]).map(x=>nombrePerfil(x.perfiles)).join(' & ');
     return `<tr><td>${i+1}</td><td><strong>${esc(n)}</strong></td><td>${s.pj}</td><td><strong>${s.pg}</strong></td><td>${s.pp}</td><td>${s.dif>0?'+':''}${s.dif}</td></tr>`;
    }).join('')}
   </tbody>
  </table>`;
 box.classList.remove('hidden');
}

async function cargarBrackets(){
 const box=document.getElementById('bracketBox');
 const cont=document.getElementById('bracket');

 const {data:rondas,error}=await sbClient
  .from('torneo_rondas')
  .select('id,numero,nombre,estado')
  .eq('torneo_id',torneoActual.id)
  .order('numero');

 if(error||!rondas?.length){box.classList.add('hidden');return;}

 let html='';

 for(const r of rondas){
  const {data:matches}=await sbClient
   .from('torneo_enfrentamientos')
   .select(`
    id,numero,estado,mesa_id,ganador_id,puntos_ganador,puntos_perdedor,
    torneo_enfrentamiento_equipos(
     lado,equipo_id,
     torneo_equipos(
      id,nombre,
      torneo_equipo_jugadores(jugador_id,perfiles(username,nombre_completo))
     )
    )
   `)
   .eq('ronda_id',r.id)
   .order('numero');

  html+=`<div class="round"><h3>${esc(r.nombre||('Ronda '+r.numero))}</h3>`;

  for(const m of (matches||[])){
   const teams={1:null,2:null};
   (m.torneo_enfrentamiento_equipos||[]).forEach(x=>teams[x.lado]=x.torneo_equipos);

   const card=(t)=>{
    if(!t)return '<div class="team">Esperando rival...</div>';
    const p=(t.torneo_equipo_jugadores||[]).map(x=>nombrePerfil(x.perfiles)).join('<br>');
    return `<div class="team ${m.ganador_id===t.id?'win':''}"><strong>${esc(t.nombre)}</strong><div class="players">${esc(p).replaceAll('&lt;br&gt;','<br>')}</div></div>`;
   };

   let action='';
   if(esAdmin&&m.estado==='pendiente'&&teams[1]&&teams[2])
      action=`<button class="btn amber" style="width:100%;margin-top:8px" onclick="abrirMesa('${m.id}')">🎲 Abrir mesa</button>`;
   if(m.estado==='en_curso'&&m.mesa_id)
      action=`<button class="btn" style="width:100%;margin-top:8px" onclick="location.href='mesa.html?id=${m.mesa_id}'">🎯 Ver mesa</button>`;
   if(m.estado==='finalizado')
      action=`<div class="small" style="text-align:center;margin-top:7px">✅ ${m.puntos_ganador??''} - ${m.puntos_perdedor??''}</div>`;

   html+=`
    <div class="match">
     <div class="match-grid">
      ${card(teams[1])}
      <div class="vs">VS</div>
      ${card(teams[2])}
     </div>
     ${action}
    </div>`;
  }

  html+='</div>';
 }

 cont.innerHTML=html;
 box.classList.remove('hidden');
}

async function abrirMesa(matchId){
 const {data,error}=await sbClient.rpc(
  'abrir_enfrentamiento_torneo',
  {p_enfrentamiento_id:matchId}
 );

 if(error||data?.success===false){
  alert('No se pudo abrir la mesa: '+(error?.message||data?.error||'Error'));
  return;
 }

 location.href='mesa.html?id='+encodeURIComponent(data.mesa_id);
}

// Realtime y respaldo periódico.
let canal=null;

function iniciarRealtime(){
 if(typeof sbClient.channel!=='function')return;

 try{
  canal=sbClient
   .channel('torneos-control-live')
   .on('postgres_changes',{event:'*',schema:'public',table:'torneos'},()=>cargarTodo())
   .on('postgres_changes',{event:'*',schema:'public',table:'torneo_participantes'},()=>torneoActual&&abrirTorneo(torneoActual.id))
   .on('postgres_changes',{event:'*',schema:'public',table:'torneo_solicitudes_pareja'},()=>torneoActual&&abrirTorneo(torneoActual.id))
   .on('postgres_changes',{event:'*',schema:'public',table:'torneo_equipos'},()=>torneoActual&&abrirTorneo(torneoActual.id))
   .on('postgres_changes',{event:'*',schema:'public',table:'torneo_rondas'},()=>torneoActual&&abrirTorneo(torneoActual.id))
   .on('postgres_changes',{event:'*',schema:'public',table:'torneo_enfrentamientos'},()=>torneoActual&&abrirTorneo(torneoActual.id))
   .subscribe(status=>console.log('[TORNEOS] Realtime:',status));
 }catch(e){console.warn('[TORNEOS] Realtime no iniciado',e);}
}

setInterval(()=>{
 if(torneoActual) abrirTorneo(torneoActual.id);
 else cargarTodo();
},10000);

document.getElementById('editSistema').addEventListener('change',actualizarEditorSistema);

window.addEventListener('DOMContentLoaded',async()=>{
 actualizarConfiguracionModalidad();
 iniciarRealtime();
 await inicializar();
});
</script>
