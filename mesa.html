<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apuntes SISMA - Mesa de Juego</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-javascript@2"></script>
<style>
    :root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --p1-color: #38bdf8;
    --p2-color: #f43f5e;
    --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 15px; display: flex; justify-content: center; }
    .container { max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 15px; }

    /* Encabezado */
    .header-nav { display: flex; justify-content: space-between; align-items: center; }
    .btn-back { background: #334155; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
    
    /* Marcador Principal */
    .scoreboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--card-bg); border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #334155; }
    .team-box { display: flex; flex-direction: column; gap: 5px; }
    .team-box.p1 { color: var(--p1-color); }
    .team-box.p2 { color: var(--p2-color); }
    .team-names { font-size: 0.85rem; color: var(--text-muted); min-height: 36px; }
    .score-big { font-size: 3.5rem; font-weight: bold; line-height: 1; margin: 10px 0; }

    /* Panel de Anote */
    .anote-card { background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1fr solid #334155; }
    .anote-card h3 { font-size: 1rem; margin-bottom: 10px; color: var(--text-muted); text-align: center; }
    .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .input-box { display: flex; flex-direction: column; gap: 5px; }
    .input-box label { font-size: 0.8rem; font-weight: bold; }
    input[type="number"] { padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1.2rem; text-align: center; }
    
    .btn-anotar { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; background: var(--accent); color: white; cursor: pointer; }
    .btn-anotar:hover { background: var(--accent-hover); }

    /* Historial */
    .history-card { background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.95rem; }
    th { padding: 8px; color: var(--text-muted); border-bottom: 1px solid #334155; font-size: 0.85rem; }
    td { padding: 10px 8px; border-bottom: 1px solid #0f172a; }

    /* Aviso Espectador */
    .spectator-banner { background: #1e293b; border: 1px solid #334155; border-left: 4px solid #eab308; padding: 10px; border-radius: 6px; font-size: 0.85rem; text-align: center; color: #fef08a; }
    .hidden { display: none !important; }
</style>
</head>
<body>

<div class="container">
    <div class="header-nav">
    <a href="index.html" class="btn-back">← Volver al Lobby</a>
    <span id="live-indicator" style="font-size:0.8rem; color:var(--success); font-weight:bold;">● EN VIVO</span>
    </div>

    <!-- MARCADOR GLOBAL -->
    <div class="scoreboard">
    <div class="team-box p1">
        <h2>PAREJA 1</h2>
        <div class="team-names" id="p1-names">Cargando...</div>
        <div class="score-big" id="p1-score">0</div>
    </div>
    <div class="team-box p2">
        <h2>PAREJA 2</h2>
        <div class="team-names" id="p2-names">Cargando...</div>
        <div class="score-big" id="p2-score">0</div>
    </div>
    </div>

    <!-- MODO ESPECTADOR (Si no está jugando en esta mesa) -->
    <div id="spectator-msg" class="spectator-banner hidden">
    👁️ Estás viendo esta partida en <strong>Modo Espectador</strong>. El marcador se actualiza automáticamente.
    </div>

    <!-- PANEL DE ANOTE (Solo visible para los 4 jugadores o Admin) -->
    <div id="anote-panel" class="anote-card hidden">
    <h3>Anotar Puntos de la Mano</h3>
    <form onsubmit="registrarMano(event)">
        <div class="input-group">
        <div class="input-box">
            <label style="color:var(--p1-color)">Puntos Pareja 1</label>
            <input type="number" id="pts-p1" min="0" placeholder="0" value="0" onclick="this.select()">
        </div>
        <div class="input-box">
            <label style="color:var(--p2-color)">Puntos Pareja 2</label>
            <input type="number" id="pts-p2" min="0" placeholder="0" value="0" onclick="this.select()">
        </div>
        </div>
        <button type="submit" class="btn-anotar">Guardar Mano</button>
    </form>
    </div>

    <!-- HISTORIAL DE MANOS -->
    <div class="history-card">
    <h3 style="margin-bottom:10px; font-size:0.9rem; color:var(--text-muted)">Historial de Manos</h3>
    <table>
        <thead>
        <tr>
            <th>#</th>
            <th style="color:var(--p1-color)">Pareja 1</th>
            <th style="color:var(--p2-color)">Pareja 2</th>
        </tr>
        </thead>
        <tbody id="tabla-manos">
        <tr><td colspan="3" style="color:var(--text-muted)">Cargando jugadas...</td></tr>
        </tbody>
    </table>
    </div>
</div>

<script>
    // -------------------------------------------------------------
    // CREDENCIALES DE SUPABASE
    // -------------------------------------------------------------
    const SUPABASE_URL = 'https://kzbslfwupzwczmjqfjem.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YnNsZnd1cHp3Y3ptanFmamVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDI1MzksImV4cCI6MjEwMjcxODUzOX0.qeeh2FV3zKRet-jRMVvJUwBm9jYHsLbWSYWIao574qc'; // Copia tu clave anon de Supabase

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const mesaId = new URLSearchParams(window.location.search).get('id');
    let usuarioActual = null;
    let esJugadorDeMesa = false;

    window.addEventListener('DOMContentLoaded', async () => {
    if (!mesaId) {
        alert('Mesa no encontrada');
        window.location.href = 'index.html';
        return;
    }
    await obtenerUsuario();
    await cargarDatosMesa();
    await cargarManos();
    suscribirseCambiosEnVivo();
    });

    async function obtenerUsuario() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
        usuarioActual = session.user;
    }
    }

    async function cargarDatosMesa() {
    const { data: mesa, error } = await supabase
        .from('mesas')
        .select(`
          *,
        j1:jugador1_id(id, nombre_completo),
        j2:jugador2_id(id, nombre_completo),
        j3:jugador3_id(id, nombre_completo),
        j4:jugador4_id(id, nombre_completo)
        `)
        .eq('id', mesaId)
        .single();

    if (error || !mesa) {
        alert('Error al cargar la mesa');
        window.location.href = 'index.html';
        return;
    }

      // Mostrar Nombres
    document.getElementById('p1-names').innerText = `${mesa.j1?.nombre_completo || 'N/A'}\n${mesa.j3?.nombre_completo || 'N/A'}`;
    document.getElementById('p2-names').innerText = `${mesa.j2?.nombre_completo || 'N/A'}\n${mesa.j4?.nombre_completo || 'N/A'}`;

      // Validar si el usuario activo es uno de los 4 jugadores
    if (usuarioActual) {
        const idsJugadores = [mesa.jugador1_id, mesa.jugador2_id, mesa.jugador3_id, mesa.jugador4_id];
        if (idsJugadores.includes(usuarioActual.id)) {
        esJugadorDeMesa = true;
        }
    }

      // Habilitar o Bloquear Formulario de Anote
    if (esJugadorDeMesa) {
        document.getElementById('anote-panel').classList.remove('hidden');
        document.getElementById('spectator-msg').classList.add('hidden');
    } else {
        document.getElementById('anote-panel').classList.add('hidden');
        document.getElementById('spectator-msg').classList.remove('hidden');
    }
    }

    async function cargarManos() {
    const { data: manos, error } = await supabase
        .from('manos')
        .select('*')
        .eq('mesa_id', mesaId)
        .order('creado_en', { ascending: true });

    if (error) return;

    let totalP1 = 0;
    let totalP2 = 0;
    const tbody = document.getElementById('tabla-manos');
    tbody.innerHTML = '';

    if (manos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="color:var(--text-muted)">Aún no se han anotado manos.</td></tr>';
    } else {
        manos.forEach((m, idx) => {
        totalP1 += m.puntos_pareja1;
        totalP2 += m.puntos_pareja2;

        tbody.innerHTML += `
            <tr>
            <td>${idx + 1}</td>
            <td style="font-weight:bold; color:var(--p1-color)">+${m.puntos_pareja1}</td>
            <td style="font-weight:bold; color:var(--p2-color)">+${m.puntos_pareja2}</td>
            </tr>
        `;
        });
    }

    document.getElementById('p1-score').innerText = totalP1;
    document.getElementById('p2-score').innerText = totalP2;
    }

    async function registrarMano(e) {
    e.preventDefault();
    const p1 = parseInt(document.getElementById('pts-p1').value) || 0;
    const p2 = parseInt(document.getElementById('pts-p2').value) || 0;

    if (p1 === 0 && p2 === 0) {
        alert('Ingresa los puntos anotados por una de las parejas.');
        return;
    }

    const { error } = await supabase
        .from('manos')
        .insert([{
        mesa_id: mesaId,
        puntos_pareja1: p1,
        puntos_pareja2: p2,
        creado_por: usuarioActual ? usuarioActual.id : null
        }]);

    if (error) {
        alert('Error al registrar mano: ' + error.message);
    } else {
        document.getElementById('pts-p1').value = '0';
        document.getElementById('pts-p2').value = '0';
        cargarManos();
    }
    }

    // Sincronización en Tiempo Real
    function suscribirseCambiosEnVivo() {
    supabase
        .channel(`mesa-${mesaId}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'manos', filter: `mesa_id=eq.${mesaId}` }, () => {
        cargarManos();
        })
        .subscribe();
    }
</script>
</body>
</html>
