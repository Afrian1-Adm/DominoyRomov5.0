<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Dominó - Apuntes</title>
    
    <!-- Script de carga inmediata para evitar destellos de tema -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.classList.add('light-mode');
            }
        })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    :root {
        --bg-color: #0b1329;
        --card-bg: #152238;
        --card-inner: #1c2d4a;
        --accent: #2563eb;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --pareja1: #38bdf8;
        --pareja2: #f87171;
        --border-color: #2a3a5c;
    }

    /* Variables cuando el modo claro está activo */
    html.light-mode {
        --bg-color: #f1f5f9;
        --card-bg: #ffffff;
        --card-inner: #e2e8f0;
        --accent: #2563eb;
        --text: #0f172a;
        --text-muted: #64748b;
        --pareja1: #0284c7;
        --pareja2: #dc2626;
        --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 12px; display: flex; justify-content: center; transition: background-color 0.3s, color 0.3s; }
    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 14px; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .btn-back { background: var(--card-bg); color: var(--text); text-decoration: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; border: 1px solid var(--border-color); font-size: 0.85rem; cursor: pointer; }
    .live-badge { color: #22c55e; font-size: 0.8rem; font-weight: bold; }

    .card { background: var(--card-bg); border-radius: 14px; padding: 16px; border: 1px solid var(--border-color); }
    .error-banner { background: #7f1d1d; border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 10px; font-size: 0.85rem; text-align: center; word-break: break-word; }
    .info-banner { background: var(--card-inner); border: 1px solid var(--border-color); color: var(--text-muted); padding: 12px; border-radius: 10px; font-size: 0.85rem; text-align: center; }
    .winner-banner { background: #065f46; border: 1px solid #10b981; color: #a7f3d0; padding: 14px; border-radius: 10px; font-size: 1rem; text-align: center; font-weight: bold; }
    
    /* Banner de Lisa con animación divertida */
    .lisa-banner { 
        background: linear-gradient(135deg, #f59e0b, #ef4444); 
        color: white; 
        padding: 16px; 
        border-radius: 12px; 
        font-weight: bold; 
        text-align: center; 
        font-size: 1.05rem; 
        box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5); 
        animation: pulseAlert 0.6s ease infinite alternate; 
        border: 2px solid #fcd34d;
        margin-bottom: 10px;
    }
    @keyframes pulseAlert { 
        from { transform: scale(1); } 
        to { transform: scale(1.02); } 
    }

    .target-box { text-align: center; color: var(--accent); font-weight: bold; font-size: 0.95rem; margin-bottom: 12px; }

    .marcador-grid, .inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .equipo-card { background: var(--card-inner); border-radius: 10px; padding: 14px 10px; text-align: center; border: 1px solid var(--border-color); }
    .equipo-titulo { font-size: 0.75rem; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .equipo-nombres { font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p1-color { color: var(--pareja1); }
    .p2-color { color: var(--pareja2); }
    .score-num { font-size: 2.2rem; font-weight: 800; line-height: 1; }

    .section-title { font-size: 1rem; font-weight: bold; margin-bottom: 12px; }

    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-inner); color: var(--text); font-size: 1rem; text-align: center; min-height: 48px; }
    input::placeholder { color: var(--text-muted); font-size: 0.85rem; }

    .btn { width: 100%; min-height: 48px; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: var(--accent); color: white; font-size: 1rem; margin-top: 10px; }

    .tabla-historial { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.85rem; }
    .tabla-historial th { padding: 8px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); }
    .tabla-historial td { padding: 10px 4px; border-bottom: 1px solid var(--border-color); }
    .mano-anulada { text-decoration: line-through; opacity: 0.4; }

    .action-btns { display: flex; gap: 6px; justify-content: center; }
    .btn-icon { border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: white; font-size: 0.8rem; }
    .btn-annul { background: #dc2626; }
    .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <a href="index.html" class="btn-back">← Volver al Lobby</a>
        <div class="top-actions">
            <button onclick="cambiarTema()" class="btn-back" title="Cambiar Modo Claro/Oscuro">🌓 Tema</button>
            <span class="live-badge" id="status-badge">• EN VIVO</span>
        </div>
    </div>

    <!-- Banner global de Lisa -->
    <div id="lisa-box" class="lisa-banner hidden"></div>

    <div id="error-box" class="error-banner hidden"></div>
    <div id="winner-box" class="winner-banner hidden"></div>
    <div id="spectator-box" class="info-banner hidden">👁️ Modo Espectador: Solo los jugadores de esta mesa pueden anotar puntos.</div>

    <!-- TARJETA UNIFICADA -->
    <div class="card">
        <div id="meta-display" class="target-box">Meta: --- pts</div>
        
        <div class="marcador-grid">
            <div class="equipo-card">
                <div class="equipo-titulo">PAREJA 1</div>
                <div id="p1-nombres" class="equipo-nombres p1-color">Cargando...</div>
                <div id="p1-score" class="score-num p1-color">0</div>
            </div>

            <div class="equipo-card">
                <div class="equipo-titulo">PAREJA 2</div>
                <div id="p2-nombres" class="equipo-nombres p2-color">Cargando...</div>
                <div id="p2-score" class="score-num p2-color">0</div>
            </div>
        </div>

        <!-- FORMULARIO DE ANOTACIÓN -->
        <div id="card-anotar" style="margin-top: 14px;">
            <form onsubmit="guardarMano(event)">
                <div class="inputs-grid">
                    <input type="number" id="input-p1" placeholder="Pts Pareja 1" min="0" step="1" inputmode="numeric">
                    <input type="number" id="input-p2" placeholder="Pts Pareja 2" min="0" step="1" inputmode="numeric">
                </div>
                <button type="submit" class="btn" id="btn-anotar">Anotar Mano</button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="section-title">Historial de Manos</div>
        <table class="tabla-historial">
            <thead>
                <tr>
                    <th>#</th>
                    <th style="color: var(--pareja1);">Pareja 1</th>
                    <th style="color: var(--pareja2);">Pareja 2</th>
                    <th id="th-acciones">Acciones</th>
                </tr>
            </thead>
            <tbody id="lista-manos">
                <tr><td colspan="4" style="color: var(--text-muted);">Cargando historial...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function cambiarTema() {
        const html = document.documentElement;
        html.classList.toggle('light-mode');
        const currentTheme = html.classList.contains('light-mode') ? 'light' : 'dark';
        localStorage.setItem('theme', currentTheme);
    }

    window.onerror = function(msg) {
        mostrarError('Error JS: ' + msg);
        return false;
    };

    function mostrarError(msj) {
        const box = document.getElementById('error-box');
        if (box) {
            box.innerText = msj;
            box.classList.remove('hidden');
        }
    }

    const SUPABASE_URL = 'https://kzbslfwupzwczmjqfjem.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YnNsZnd1cHp3Y3ptanFmamVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDI1MzksImV4cCI6MjEwMjcxODUzOX0.qeeh2FV3zKRet-jRMVvJUwBm9jYHsLbWSYWIao574qc';

    var sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
    var mesaId = new URLSearchParams(window.location.search).get('id');
    var cacheKey = 'cache_mesa_' + mesaId;
    var esJugadorDeMesa = false;
    var juegoFinalizado = false;
    
    var nombresJugadoresMesa = { j1: 'Jugador 1', j2: 'Jugador 2', j3: 'Jugador 3', j4: 'Jugador 4' };

    // CARGA INSTANTÁNEA DESDE CACHÉ LOCAL (Evita parpadeos y muestra nombres y puntajes de inmediato)
    if (mesaId) {
        const cachedMesa = localStorage.getItem(cacheKey);
        if (cachedMesa) {
            try {
                const data = JSON.parse(cachedMesa);
                if (data.meta) document.getElementById('meta-display').innerText = `Meta: ${data.meta} pts`;
                if (data.p1Nombres) document.getElementById('p1-nombres').innerText = data.p1Nombres;
                if (data.p2Nombres) document.getElementById('p2-nombres').innerText = data.p2Nombres;
                if (data.scoreP1 !== undefined) document.getElementById('p1-score').innerText = data.scoreP1;
                if (data.scoreP2 !== undefined) document.getElementById('p2-score').innerText = data.scoreP2;
                if (data.manosHTML) document.getElementById('lista-manos').innerHTML = data.manosHTML;
                
                if (data.nombresJugadoresMesa) {
                    nombresJugadoresMesa = data.nombresJugadoresMesa;
                    document.getElementById('input-p1').placeholder = `Pts de ${nombresJugadoresMesa.j1} y ${nombresJugadoresMesa.j3}`;
                    document.getElementById('input-p2').placeholder = `Pts de ${nombresJugadoresMesa.j2} y ${nombresJugadoresMesa.j4}`;
                }
            } catch (e) {
                console.error('Error al leer caché local:', e);
            }
        }
    }

    const sonidoChiva = new Audio('https://upload.wikimedia.org/wikipedia/commons/d/d3/Goat_bleating_in_The_Nursery_Rhymes_Project_2.ogg');
    sonidoChiva.preload = 'auto';

    window.addEventListener('DOMContentLoaded', async () => {
        try {
            document.body.addEventListener('click', () => {
                sonidoChiva.play().then(() => {
                    sonidoChiva.pause();
                    sonidoChiva.currentTime = 0;
                }).catch(() => {});
            }, { once: true });

            if (!sbClient) {
                mostrarError('No se pudo inicializar Supabase.');
                return;
            }

            if (!mesaId) {
                mostrarError('Falta el ID de la mesa en la URL.');
                return;
            }

            const { data: { session }, error: sessionError } = await sbClient.auth.getSession();
            if (sessionError || !session) {
                window.location.href = 'index.html';
                return;
            }

            await cargarMesa();

            sbClient.channel('global-app-manos')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'manos' }, async (payload) => {
                    const nuevaMano = payload.new;
                    if (!nuevaMano || nuevaMano.anulada) return;

                    if (nuevaMano.mesa_id === mesaId) {
                        cargarMesa();
                    }

                    const p1 = nuevaMano.puntos_pareja1 || 0;
                    const p2 = nuevaMano.puntos_pareja2 || 0;

                    if ((p1 > 0 && p2 === 0) || (p2 > 0 && p1 === 0)) {
                        const parejaPerdedora = p1 > 0 ? 'Pareja 2' : 'Pareja 1';
                        await consultarYDispararAlertaGlobal(nuevaMano.mesa_id, parejaPerdedora);
                    }
                })
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'manos' }, (payload) => {
                    if (payload.new && payload.new.mesa_id === mesaId) {
                        cargarMesa();
                    }
                })
                .subscribe();

        } catch (e) {
            mostrarError('Error en inicio: ' + e.message);
        }
    });

    async function consultarYDispararAlertaGlobal(targetMesaId, parejaPerdedora) {
        try {
            const { data: mesaData } = await sbClient.from('mesas').select('*').eq('id', targetMesaId).single();
            if (!mesaData) return;

            const jIds = [mesaData.jugador1_id, mesaData.jugador2_id, mesaData.jugador3_id, mesaData.jugador4_id].filter(Boolean);
            if (jIds.length === 0) return;

            const { data: perfiles } = await sbClient.from('perfiles').select('id, nombre_completo').in('id', jIds);
            const map = {};
            if (perfiles) {
                perfiles.forEach(p => map[p.id] = (p.nombre_completo || 'Jugador').split(' ')[0]);
            }

            let nombresArr = [];
            if (parejaPerdedora === 'Pareja 1') {
                nombresArr = [map[mesaData.jugador1_id] || 'J1', map[mesaData.jugador3_id] || 'J3'];
            } else {
                nombresArr = [map[mesaData.jugador2_id] || 'J2', map[mesaData.jugador4_id] || 'J4'];
            }

            const nombresStr = nombresArr.join(' y ');
            dispararAlertaLisa(parejaPerdedora, [nombresStr]);
        } catch (err) {
            console.error('Error al consultar alerta global:', err);
        }
    }

    function dispararAlertaLisa(nombrePareja, nombresArr) {
        const nombresStr = nombresArr.filter(Boolean).join(' y ');
        const lisaBox = document.getElementById('lisa-box');
        
        if (lisaBox) {
            lisaBox.innerHTML = `🐐 ¡Meeeee! A <strong>${nombresStr}</strong> (${nombrePareja}) le acaban de dar una lisa. ¡A tomar leche! 🍼😂`;
            lisaBox.classList.remove('hidden');

            sonidoChiva.currentTime = 0;
            sonidoChiva.play().catch(err => console.log('Audio bloqueado:', err));

            setTimeout(() => {
                lisaBox.classList.add('hidden');
                lisaBox.innerHTML = '';
            }, 7000);
        }
    }

    async function cargarMesa() {
        if (!sbClient || !mesaId) return;

        const { data: { user } } = await sbClient.auth.getUser();
        const currentUserId = user ? user.id : null;

        const { data: mesa, error: errMesa } = await sbClient
            .from('mesas')
            .select('*')
            .eq('id', mesaId)
            .single();

        if (errMesa || !mesa) {
            mostrarError('Mesa no encontrada.');
            return;
        }

        const limitePuntos = mesa.limite_puntos || 200;
        document.getElementById('meta-display').innerText = `Meta: ${limitePuntos} pts`;

        const listaJugadores = [mesa.jugador1_id, mesa.jugador2_id, mesa.jugador3_id, mesa.jugador4_id].filter(Boolean);
        esJugadorDeMesa = currentUserId && listaJugadores.includes(currentUserId);

        let p1Texto = 'Pareja 1';
        let p2Texto = 'Pareja 2';

        if (listaJugadores.length > 0) {
            const { data: perfiles } = await sbClient
                .from('perfiles')
                .select('id, nombre_completo')
                .in('id', listaJugadores);

            if (perfiles) {
                const map = {};
                perfiles.forEach(p => map[p.id] = (p.nombre_completo || 'Jugador').split(' ')[0]);
                
                nombresJugadoresMesa.j1 = map[mesa.jugador1_id] || 'J1';
                nombresJugadoresMesa.j2 = map[mesa.jugador2_id] || 'J2';
                nombresJugadoresMesa.j3 = map[mesa.jugador3_id] || 'J3';
                nombresJugadoresMesa.j4 = map[mesa.jugador4_id] || 'J4';

                p1Texto = `${nombresJugadoresMesa.j1} / ${nombresJugadoresMesa.j3}`;
                p2Texto = `${nombresJugadoresMesa.j2} / ${nombresJugadoresMesa.j4}`;
            }
        }

        document.getElementById('p1-nombres').innerText = p1Texto;
        document.getElementById('p2-nombres').innerText = p2Texto;

        document.getElementById('input-p1').placeholder = `Pts de ${nombresJugadoresMesa.j1} y ${nombresJugadoresMesa.j3}`;
        document.getElementById('input-p2').placeholder = `Pts de ${nombresJugadoresMesa.j2} y ${nombresJugadoresMesa.j4}`;

        const { data: manos, error: errManos } = await sbClient
            .from('manos')
            .select('*')
            .eq('mesa_id', mesaId)
            .order('creado_en', { ascending: true });

        if (errManos) {
            mostrarError('Error al leer manos: ' + errManos.message);
            return;
        }

        let scoreP1 = 0;
        let scoreP2 = 0;
        const tbody = document.getElementById('lista-manos');
        tbody.innerHTML = '';

        if (manos && manos.length > 0) {
            manos.forEach((m) => {
                if (!m.anulada) {
                    scoreP1 += (m.puntos_pareja1 || 0);
                    scoreP2 += (m.puntos_pareja2 || 0);
                }
            });
        }

        document.getElementById('p1-score').innerText = scoreP1;
        document.getElementById('p2-score').innerText = scoreP2;

        juegoFinalizado = scoreP1 >= limitePuntos || scoreP2 >= limitePuntos;
        const winnerBox = document.getElementById('winner-box');
        const statusBadge = document.getElementById('status-badge');

        if (juegoFinalizado) {
            let ganador = scoreP1 >= limitePuntos ? `🏆 ¡Ganó ${p1Texto} (${scoreP1} pts)!` : `🏆 ¡Ganó ${p2Texto} (${scoreP2} pts)!`;
            winnerBox.innerText = ganador;
            winnerBox.classList.remove('hidden');
            statusBadge.innerText = '• FINALIZADO';
            statusBadge.style.color = '#ef4444';

            if (mesa.estado !== 'finalizada') {
                await sbClient.from('mesas').update({ estado: 'finalizada' }).eq('id', mesaId);
            }
        } else {
            winnerBox.classList.add('hidden');
            statusBadge.innerText = '• EN VIVO';
            statusBadge.style.color = '#22c55e';

            if (mesa.estado === 'finalizada') {
                await sbClient.from('mesas').update({ estado: 'jugando' }).eq('id', mesaId);
            }
        }

        const cardAnotar = document.getElementById('card-anotar');
        const spectatorBox = document.getElementById('spectator-box');
        const thAcciones = document.getElementById('th-acciones');

        if (esJugadorDeMesa && !juegoFinalizado) {
            cardAnotar.classList.remove('hidden');
            spectatorBox.classList.add('hidden');
            if (thAcciones) thAcciones.classList.remove('hidden');
        } else {
            cardAnotar.classList.add('hidden');
            if (!esJugadorDeMesa) spectatorBox.classList.remove('hidden');
            else spectatorBox.classList.add('hidden');
            if (thAcciones && !esJugadorDeMesa) thAcciones.classList.add('hidden');
        }

        const colspanVal = esJugadorDeMesa ? "4" : "3";
        if (!manos || manos.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${colspanVal}" style="color: var(--text-muted); font-size:0.8rem;">Sin manos anotadas.</td></tr>`;
        } else {
            manos.forEach((m, idx) => {
                let accionesHTML = '';
                if (esJugadorDeMesa) {
                    if (m.anulada) {
                        accionesHTML = `<td><span style="font-size: 0.75rem; color: var(--text-muted);">Anulada</span></td>`;
                    } else {
                        accionesHTML = `
                            <td>
                                <div class="action-btns">
                                    <button class="btn-icon btn-annul" onclick="anularMano('${m.id}')" title="Anular mano">🚫</button>
                                </div>
                            </td>
                        `;
                    }
                }

                tbody.innerHTML += `
                    <tr class="${m.anulada ? 'mano-anulada' : ''}">
                        <td>#${idx + 1}</td>
                        <td style="font-weight: bold;">${m.puntos_pareja1 || 0} pts</td>
                        <td style="font-weight: bold;">${m.puntos_pareja2 || 0} pts</td>
                        ${accionesHTML}
                    </tr>
                `;
            });
        }

        // GUARDAR EN CACHÉ LOCAL INCLUYENDO LOS NOMBRES DE LOS JUGADORES
        try {
            const cacheData = {
                meta: limitePuntos,
                p1Nombres: p1Texto,
                p2Nombres: p2Texto,
                scoreP1: scoreP1,
                scoreP2: scoreP2,
                manosHTML: tbody.innerHTML,
                nombresJugadoresMesa: { ...nombresJugadoresMesa }
            };
            localStorage.setItem(cacheKey, JSON.stringify(cacheData));
        } catch (err) {
            console.error('Error al guardar caché local:', err);
        }
    }

    async function guardarMano(e) {
        e.preventDefault();

        if (!esJugadorDeMesa || juegoFinalizado) {
            alert('El juego ha finalizado o no estás registrado como jugador en esta mesa.');
            return;
        }

        const p1Input = document.getElementById('input-p1');
        const p2Input = document.getElementById('input-p2');

        const valP1 = parseInt(p1Input.value) || 0;
        const valP2 = parseInt(p2Input.value) || 0;

        if (valP1 === 0 && valP2 === 0) {
            alert('Ingresa los puntos de una pareja.');
            return;
        }

        const { error } = await sbClient
            .from('manos')
            .insert([{
                mesa_id: mesaId,
                puntos_pareja1: valP1,
                puntos_pareja2: valP2,
                anulada: false
            }]);

        if (error) {
            mostrarError('Error al guardar mano: ' + error.message);
        } else {
            p1Input.value = '';
            p2Input.value = '';
            cargarMesa();
        }
    }

    async function anularMano(manoId) {
        if (!esJugadorDeMesa) return;

        if (!confirm('¿Estás seguro de que deseas anular esta mano? Esta acción es irreversible y no se podrá desanular.')) {
            return;
        }

        const { error } = await sbClient
            .from('manos')
            .update({ anulada: true })
            .eq('id', manoId);

        if (error) {
            mostrarError('Error al anular: ' + error.message);
        } else {
            cargarMesa();
        }
    }
</script>
</body>
</html>
