<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Dominó - Apuntes</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #16a34a;
      --warning: #ca8a04;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }
    
    .card { background-color: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    
    .btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
    .btn-secondary { background: #334155; color: white; }
    .btn-primary { background: var(--accent); color: white; }
    
    .scoreboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: center; margin-top: 10px; }
    .team-box { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
    .team-title { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 4px; }
    .team-names { font-size: 1rem; font-weight: bold; margin-bottom: 8px; }
    .team-score { font-size: 2.5rem; font-weight: 800; }
    .p1-color { color: #38bdf8; }
    .p2-color { color: #f87171; }

    .meta-badge { text-align: center; font-weight: bold; color: var(--warning); margin-top: 5px; font-size: 0.9rem; }

    .form-row { display: flex; gap: 10px; margin-top: 10px; }
    .form-row input { flex: 1; padding: 12px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px; font-size: 1rem; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: center; }
    th, td { padding: 10px; border-bottom: 1px solid #334155; }
    th { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; }
    
    .mano-anulada { text-decoration: line-through; opacity: 0.4; background-color: rgba(220, 38, 38, 0.15); }
    
    .btn-sm { padding: 6px 10px; font-size: 0.8rem; border-radius: 4px; border: none; cursor: pointer; margin: 2px; }
    .btn-edit { background: #3b82f6; color: white; }
    .btn-annul { background: var(--warning); color: white; }
    .btn-restore { background: var(--success); color: white; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <a href="index.html" class="btn btn-secondary">← Volver al Lobby</a>
    <span style="color: var(--success); font-weight: bold;">● EN VIVO</span>
  </div>

  <!-- Mensaje de error si la URL no trae ID válido -->
  <div id="error-container" class="card" style="display: none; background: #7f1d1d; color: white; text-align: center;">
    <h3>⚠️ Mesa no encontrada</h3>
    <p style="margin-top: 8px;">No se especificó un ID de mesa válido. Selecciona una mesa desde el lobby.</p>
    <a href="index.html" class="btn btn-secondary" style="margin-top: 12px;">Ir al Lobby</a>
  </div>

  <div id="mesa-content" style="display: flex; flex-direction: column; gap: 16px;">
    <!-- Marcador -->
    <div class="card">
      <div class="meta-badge" id="label-meta">Meta: 200 pts</div>
      <div class="scoreboard">
        <div class="team-box">
          <div class="team-title">PAREJA 1</div>
          <div class="team-names p1-color" id="p1-nombres">Cargando...</div>
          <div class="team-score p1-color" id="total-p1">0</div>
        </div>
        <div class="team-box">
          <div class="team-title">PAREJA 2</div>
          <div class="team-names p2-color" id="p2-nombres">Cargando...</div>
          <div class="team-score p2-color" id="total-p2">0</div>
        </div>
      </div>
    </div>

    <!-- Anotar Mano -->
    <div class="card" id="contenedor-form-mano">
      <h3>Anotar Mano</h3>
      <form id="form-mano" onsubmit="registrarMano(event)">
        <div class="form-row">
          <input type="number" id="puntos-p1" placeholder="Pts Pareja 1" min="0">
          <input type="number" id="puntos-p2" placeholder="Pts Pareja 2" min="0">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">Anotar Mano</button>
      </form>
    </div>

    <!-- Historial -->
    <div class="card">
      <h3>Historial de Manos</h3>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th class="p1-color">Pareja 1</th>
            <th class="p2-color">Pareja 2</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-manos-body">
          <!-- Las manos se cargarán dinámicamente -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // CONFIGURACIÓN DE SUPABASE
  const SUPABASE_URL = 'https://kzbslfwupzwczmjqfjem.supabase.co';
  // ⚠️ PON TU CLAVE ANON REAL AQUÍ:
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YnNsZnd1cHp3Y3ptanFmamVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDI1MzksImV4cCI6MjEwMjcxODUzOX0.qeeh2FV3zKRet-jRMVvJUwBm9jYHsLbWSYWIao574qc';

  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const mesaId = urlParams.get('id');

  let limitePuntosMesa = 200;

  window.addEventListener('DOMContentLoaded', async () => {
    if (!mesaId || mesaId === 'undefined' || mesaId.trim() === '') {
      document.getElementById('mesa-content').style.display = 'none';
      document.getElementById('error-container').style.display = 'block';
      return;
    }

    await cargarDatosMesa();
    await cargarHistorialYVerificarGanador();
  });

  // 1. CARGAR DATOS DE LA MESA Y NOMBRES
  async function cargarDatosMesa() {
    try {
      const { data: mesa, error } = await supabase
        .from('mesas')
        .select('*')
        .eq('id', mesaId)
        .single();

      if (error || !mesa) {
        console.error('Error al cargar mesa:', error);
        document.getElementById('mesa-content').style.display = 'none';
        document.getElementById('error-container').style.display = 'block';
        return;
      }

      if (mesa.limite_puntos) {
        limitePuntosMesa = mesa.limite_puntos;
        document.getElementById('label-meta').innerText = `Meta: ${limitePuntosMesa} pts`;
      }

      const ids = [mesa.jugador1_id, mesa.jugador2_id, mesa.jugador3_id, mesa.jugador4_id].filter(Boolean);
      let nombres = {};

      if (ids.length > 0) {
        const { data: usuarios } = await supabase
          .from('usuarios')
          .select('id, nombre_completo')
          .in('id', ids);

        if (usuarios) {
          usuarios.forEach(u => {
            nombres[u.id] = u.nombre_completo || 'Jugador';
          });
        }
      }

      const p1_j1 = nombres[mesa.jugador1_id] || 'Jugador 1';
      const p1_j2 = nombres[mesa.jugador2_id] || 'Jugador 2';
      const p2_j1 = nombres[mesa.jugador3_id] || 'Jugador 3';
      const p2_j2 = nombres[mesa.jugador4_id] || 'Jugador 4';

      document.getElementById('p1-nombres').innerText = `${p1_j1} / ${p1_j2}`;
      document.getElementById('p2-nombres').innerText = `${p2_j1} / ${p2_j2}`;

    } catch (e) {
      console.error('Error inesperado:', e);
    }
  }

  // 2. REGISTRAR NUEVA MANO
  async function registrarMano(event) {
    if (event) event.preventDefault();

    const inputP1 = document.getElementById('puntos-p1');
    const inputP2 = document.getElementById('puntos-p2');

    const puntosP1 = parseInt(inputP1.value) || 0;
    const puntosP2 = parseInt(inputP2.value) || 0;

    if (puntosP1 === 0 && puntosP2 === 0) {
      alert('Ingresa los puntos anotados en la mano.');
      return;
    }

    const { error } = await supabase
      .from('manos')
      .insert([{ mesa_id: mesaId, puntos_pareja1: puntosP1, puntos_pareja2: puntosP2 }]);

    if (error) {
      alert('Error al registrar la mano: ' + error.message);
      return;
    }

    inputP1.value = '';
    inputP2.value = '';

    await cargarHistorialYVerificarGanador();
  }

  // 3. CARGAR HISTORIAL, SUMAR TOTALES Y CERRAR A LOS 200 PTS
  async function cargarHistorialYVerificarGanador() {
    const { data: manos, error } = await supabase
      .from('manos')
      .select('*')
      .eq('mesa_id', mesaId)
      .order('creado_en', { ascending: true });

    if (error) {
      console.error('Error al obtener manos:', error);
      return;
    }

    let totalP1 = 0;
    let totalP2 = 0;

    const tbody = document.getElementById('tabla-manos-body');
    tbody.innerHTML = '';

    manos.forEach((mano, index) => {
      const esAnulada = mano.anulada === true;

      if (!esAnulada) {
        totalP1 += mano.puntos_pareja1;
        totalP2 += mano.puntos_pareja2;
      }

      const tr = document.createElement('tr');
      if (esAnulada) tr.classList.add('mano-anulada');

      tr.innerHTML = `
        <td>#${index + 1}</td>
        <td>${mano.puntos_pareja1} pts</td>
        <td>${mano.puntos_pareja2} pts</td>
        <td>
          <button class="btn-sm btn-edit" onclick="editarMano('${mano.id}', ${mano.puntos_pareja1}, ${mano.puntos_pareja2})">✏️ Editar</button>
          <button class="btn-sm ${esAnulada ? 'btn-restore' : 'btn-annul'}" onclick="toggleAnularMano('${mano.id}', ${esAnulada})">
            ${esAnulada ? '🔄 Restaurar' : '🚫 Anular'}
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('total-p1').innerText = totalP1;
    document.getElementById('total-p2').innerText = totalP2;

    if (totalP1 >= limitePuntosMesa || totalP2 >= limitePuntosMesa) {
      const ganador = totalP1 >= limitePuntosMesa ? 'Pareja 1' : 'Pareja 2';
      const puntosGanador = totalP1 >= limitePuntosMesa ? totalP1 : totalP2;

      await supabase
        .from('mesas')
        .update({ estado: 'cerrada' })
        .eq('id', mesaId);

      document.getElementById('contenedor-form-mano').innerHTML = `
        <div style="background: var(--success); color: white; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold;">
          🏆 ¡PARTIDA FINALIZADA A ${limitePuntosMesa} PTS! <br>
          Ganador: ${ganador} (${puntosGanador} pts)
        </div>
      `;
    }
  }

  // 4. ANULAR O RESTAURAR MANO
  async function toggleAnularMano(manoId, estadoActualAnulada) {
    const { error } = await supabase
      .from('manos')
      .update({ anulada: !estadoActualAnulada })
      .eq('id', manoId);

    if (error) alert('Error: ' + error.message);
    else cargarHistorialYVerificarGanador();
  }

  // 5. EDITAR PUNTOS DE MANO
  async function editarMano(manoId, p1Actual, p2Actual) {
    const nuevoP1 = prompt('Puntos para Pareja 1:', p1Actual);
    if (nuevoP1 === null) return;

    const nuevoP2 = prompt('Puntos para Pareja 2:', p2Actual);
    if (nuevoP2 === null) return;

    const { error } = await supabase
      .from('manos')
      .update({
        puntos_pareja1: parseInt(nuevoP1) || 0,
        puntos_pareja2: parseInt(nuevoP2) || 0
      })
      .eq('id', manoId);

    if (error) alert('Error: ' + error.message);
    else cargarHistorialYVerificarGanador();
  }
</script>

</body>
</html>
