<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Anote - Dominó</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container" id="mesa-content">
    <header>
        <h1>Mesa de Anote</h1>
        <p id="label-meta">Meta: --- pts</p>
    </header>

    <!-- Panel de Marcador -->
    <section class="card scoreboard">
        <div class="team-score">
        <span class="team-tag">PAREJA 1</span>
        <p id="p1-nombres" class="team-players">--- / ---</p>
        <div id="p1-puntos" class="score-number">0</div>
        </div>

        <div class="score-separator">:</div>

        <div class="team-score">
        <span class="team-tag">PAREJA 2</span>
        <p id="p2-nombres" class="team-players">--- / ---</p>
        <div id="p2-puntos" class="score-number">0</div>
        </div>
    </section>

    <!-- Formulario para Registrar Anote -->
    <section class="card">
        <h2 class="card-title">Registrar Mano</h2>
        <form id="form-anote" onsubmit="registrarMano(event)">
        <div class="form-grid">
            <div class="form-group">
            <label for="select-pareja-ganadora">Pareja Ganadora</label>
            <select id="select-pareja-ganadora" required>
                <option value="1">Pareja 1</option>
                <option value="2">Pareja 2</option>
            </select>
            </div>

            <div class="form-group">
            <label for="puntos-mano">Puntos anotados</label>
            <input type="number" id="puntos-mano" placeholder="Ej. 25" min="1" max="200" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary full-width-btn">Anotar Puntos</button>
        </form>
    </section>

    <!-- Historial de Manos -->
    <section class="card">
        <h2 class="card-title">Historial de Manos</h2>
        <div id="historial-manos" class="history-list">
        <!-- Se llena con JS -->
        </div>
        <button onclick="volverInicio()" class="btn btn-secondary full-width-btn" style="margin-top: 12px;">Volver al Inicio</button>
    </section>
    </div>

    <div id="error-container" class="container" style="display: none; text-align: center; margin-top: 40px;">
    <h2>Mesa no encontrada</h2>
    <p>La mesa solicitada no existe o fue cerrada.</p>
    <button onclick="volverInicio()" class="btn btn-primary" style="margin-top: 16px;">Volver al Inicio</button>
    </div>

<script>
  // CONFIGURACIÓN DE SUPABASE
    const SUPABASE_URL = 'https://kzbslfwupzwczmjqfjem.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YnNsZnd1cHp3Y3ptanFmamVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDI1MzksImV4cCI6MjEwMjcxODUzOX0.qeeh2FV3zKRet-jRMVvJUwBm9jYHsLbWSYWIao574qc';

    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let mesaId = null;
    let limitePuntosMesa = 200;

    window.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    mesaId = urlParams.get('id');

    // Si no hay ID en la URL, busca la última mesa creada en Supabase (Modo Automático/Pruebas)
    if (!mesaId || mesaId === 'undefined' || mesaId.trim() === '') {
        const { data: ultimaMesa } = await supabase
        .from('mesas')
        .select('id')
        .order('id', { ascending: false })
        .limit(1)
        .single();

    if (ultimaMesa && ultimaMesa.id) {
        mesaId = ultimaMesa.id;
    } 
    else {
        document.getElementById('mesa-content').style.display = 'none';
        document.getElementById('error-container').style.display = 'block';
        return;
    }
    }

    await cargarDatosMesa();
    await cargarHistorialYVerificarGanador();
    });

    // 1. CARGAR DATOS DE LA MESA Y RESOLVER NOMBRES
    async function cargarDatosMesa() {
    try {
        const { data: mesa, error } = await supabase
        .from('mesas')
        .select(`
        *,
        j1:jugador1_id(nombre_completo),
        j2:jugador2_id(nombre_completo),
        j3:jugador3_id(nombre_completo),
        j4:jugador4_id(nombre_completo)
        `)
        .eq('id', mesaId)
        .single();

    if (error || !mesa) {
        console.error('Error al cargar mesa:', error);
        document.getElementById('mesa-content').style.display = 'none';
        document.getElementById('error-container').style.display = 'block';
        return;
    }

    if (mesa.limite_puntos) {
        limitePuntosMesa = mesa.limite_puntos;
    }
    document.getElementById('label-meta').innerText = `Meta: ${limitePuntosMesa} pts`;

    // Asignar nombres desde la tabla 'perfiles'
    const nomJ1 = mesa.j1?.nombre_completo || 'Jugador 1';
    const nomJ2 = mesa.j2?.nombre_completo || 'Jugador 2';
    const nomJ3 = mesa.j3?.nombre_completo || 'Jugador 3';
    const nomJ4 = mesa.j4?.nombre_completo || 'Jugador 4';

    // Agrupación correcta: Pareja 1 (J1 y J3) / Pareja 2 (J2 y J4)
    document.getElementById('p1-nombres').innerText = `${nomJ1} / ${nomJ3}`;
    document.getElementById('p2-nombres').innerText = `${nomJ2} / ${nomJ4}`;

    } catch (e) {
    console.error('Error procesando nombres:', e);
    }
}

     // 2. REGISTRAR NUEVA MANO
    async function registrarMano(event) {
    if (event) event.preventDefault();

    const inputP1 = document.getElementById('puntos-p1');
    const inputP2 = document.getElementById('puntos-p2');

    const puntosP1 = parseInt(inputP1.value) || 0;
    const puntosP2 = parseInt(inputP2.value) || 0;

    if (puntosP1 === 0 && puntosP2 === 0) {
        alert('Ingresa los puntos anotados en la mano.');
        return;
    }

    const { error } = await supabase
        .from('manos')
        .insert([{ mesa_id: mesaId, puntos_pareja1: puntosP1, puntos_pareja2: puntosP2 }]);

    if (error) {
        alert('Error al registrar mano: ' + error.message);
        return;
    }

    inputP1.value = '';
    inputP2.value = '';

    await cargarHistorialYVerificarGanador();
    }

  // 3. CARGAR HISTORIAL, TOTALES Y VERIFICAR GANADOR
    async function cargarHistorialYVerificarGanador() {
    const { data: manos, error } = await supabase
        .from('manos')
        .select('*')
        .eq('mesa_id', mesaId)
        .order('id', { ascending: true });

    if (error) {
        console.error('Error cargando manos:', error);
        return;
    }

    let totalP1 = 0;
    let totalP2 = 0;

    const tbody = document.getElementById('tabla-manos-body');
    tbody.innerHTML = '';

    manos.forEach((mano, index) => {
        const esAnulada = mano.anulada === true;

        if (!esAnulada) {
        totalP1 += mano.puntos_pareja1;
        totalP2 += mano.puntos_pareja2;
        }

        const tr = document.createElement('tr');
        if (esAnulada) tr.classList.add('mano-anulada');

        tr.innerHTML = `
        <td>#${index + 1}</td>
        <td>${mano.puntos_pareja1} pts</td>
        <td>${mano.puntos_pareja2} pts</td>
        <td>
            <button class="btn-sm btn-edit" onclick="editarMano('${mano.id}', ${mano.puntos_pareja1}, ${mano.puntos_pareja2})">✏️ Editar</button>
            <button class="btn-sm ${esAnulada ? 'btn-restore' : 'btn-annul'}" onclick="toggleAnularMano('${mano.id}', ${esAnulada})">
            ${esAnulada ? '🔄 Restaurar' : '🚫 Anular'}
            </button>
        </td>
        `;
        tbody.appendChild(tr);
    });

    document.getElementById('total-p1').innerText = totalP1;
    document.getElementById('total-p2').innerText = totalP2;

    // Verificar límite para dar por terminada la mesa
    if (totalP1 >= limitePuntosMesa || totalP2 >= limitePuntosMesa) {
        const ganador = totalP1 >= limitePuntosMesa ? 'Pareja 1' : 'Pareja 2';
        const puntosGanador = totalP1 >= limitePuntosMesa ? totalP1 : totalP2;

        await supabase.from('mesas').update({ estado: 'cerrada' }).eq('id', mesaId);

        document.getElementById('contenedor-form-mano').innerHTML = `
        <div style="background: var(--success); color: white; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold;">
            🏆 ¡PARTIDA FINALIZADA A ${limitePuntosMesa} PTS! <br>
            Ganador: ${ganador} (${puntosGanador} pts)
        </div>
        `;
    }
    }

    // 4. ANULAR O RESTAURAR MANO
    async function toggleAnularMano(manoId, estadoActualAnulada) {
    const { error } = await supabase
        .from('manos')
        .update({ anulada: !estadoActualAnulada })
        .eq('id', manoId);

    if (error) alert('Error: ' + error.message);
    else cargarHistorialYVerificarGanador();
    }

    // 5. EDITAR PUNTOS
    async function editarMano(manoId, p1Actual, p2Actual) {
    const nuevoP1 = prompt('Puntos para Pareja 1:', p1Actual);
    if (nuevoP1 === null) return;

    const nuevoP2 = prompt('Puntos para Pareja 2:', p2Actual);
    if (nuevoP2 === null) return;

    const { error } = await supabase
        .from('manos')
        .update({
        puntos_pareja1: parseInt(nuevoP1) || 0,
        puntos_pareja2: parseInt(nuevoP2) || 0
        })
        .eq('id', manoId);

    if (error) alert('Error: ' + error.message);
    else cargarHistorialYVerificarGanador();
    }
</script>

</body>
</html>
