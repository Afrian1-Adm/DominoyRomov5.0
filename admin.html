<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Dominó</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    :root {
        --bg-color: #0b1329;
        --card-bg: #152238;
        --card-inner: #1c2d4a;
        --accent: #2563eb;
        --accent-green: #10b981;
        --accent-red: #ef4444;
        --accent-amber: #f59e0b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --role-jugador: #38bdf8;
        --role-invitado: #fbbf24;
        --role-admin: #a855f7;
        --role-superadmin: #ec4899;
        --pareja1: #38bdf8;
        --pareja2: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 14px; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .btn-back { background: var(--card-bg); color: var(--text); text-decoration: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; border: 1px solid #334155; font-size: 0.85rem; }

    .card { background: var(--card-bg); border-radius: 14px; padding: 16px; border: 1px solid #2a3a5c; }
    .error-banner { background: #7f1d1d; border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 10px; font-size: 0.85rem; text-align: center; word-break: break-word; }
    .section-title { font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    .form-grid { display: flex; flex-direction: column; gap: 10px; }
    .input-group { display: flex; gap: 10px; }
    
    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: var(--card-inner); color: white; font-size: 0.95rem; }
    input::placeholder { color: #64748b; }

    .btn { width: 100%; min-height: 44px; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: var(--accent); color: white; font-size: 0.95rem; }
    .btn-green { background: var(--accent-green); }

    .tabla-custom { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; margin-top: 8px; }
    .tabla-custom th { padding: 10px 8px; color: var(--text-muted); border-bottom: 1px solid #2a3a5c; text-align: left; }
    .tabla-custom td { padding: 10px 8px; border-bottom: 1px solid #1e2d4a; vertical-align: middle; }

    .badge-rol { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; display: inline-block; }
    .badge-jugador { background: rgba(56, 189, 248, 0.15); color: var(--role-jugador); border: 1px solid var(--role-jugador); }
    .badge-invitado { background: rgba(251, 191, 36, 0.15); color: var(--role-invitado); border: 1px solid var(--role-invitado); }
    .badge-admin { background: rgba(168, 85, 247, 0.15); color: var(--role-admin); border: 1px solid var(--role-admin); }
    .badge-superadmin { background: rgba(236, 72, 153, 0.2); color: var(--role-superadmin); border: 1px solid var(--role-superadmin); }
    .badge-pendiente { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid var(--accent-amber); }

    .action-btns { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
    .btn-icon { border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: white; font-size: 0.8rem; font-weight: bold; }
    .btn-edit { background: #2563eb; }
    .btn-toggle { background: #d97706; }
    .btn-admin { background: #a855f7; }
    .btn-approve { background: #10b981; }
    .btn-reject { background: #ef4444; }
    
    .mesa-card { background: var(--card-inner); border-radius: 10px; padding: 14px; border: 1px solid #2a3a5c; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
    .mesa-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3a5c; padding-bottom: 8px; }
    .mesa-titulo { font-weight: bold; color: var(--text); font-size: 0.95rem; }
    .mesa-meta { font-size: 0.8rem; color: #fbbf24; font-weight: bold; }
    
    .mesa-detalles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: center; font-size: 0.85rem; }
    .pareja-box { background: rgba(11, 19, 41, 0.5); padding: 8px; border-radius: 8px; border: 1px solid #2a3a5c; }
    .pareja-nombres { font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .p1-color { color: var(--pareja1); }
    .p2-color { color: var(--pareja2); }
    .puntos-num { font-size: 1.3rem; font-weight: 800; }

    .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <a href="index.html" class="btn-back">← Volver al Lobby</a>
        <span id="label-nivel-admin" style="font-size: 0.9rem; font-weight: bold; color: var(--accent-green);">Panel Admin</span>
    </div>

    <div id="error-box" class="error-banner hidden"></div>

    <!-- 1. SOLICITUDES PENDIENTES RESTAURADAS -->
    <div class="card">
        <div class="section-title">
            <span>Solicitudes Pendientes</span>
            <span id="count-solicitudes" class="badge-rol badge-pendiente">0</span>
        </div>
        <table class="tabla-custom">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Estatus</th>
                    <th style="text-align: right;">Acciones</th>
                </tr>
            </thead>
            <tbody id="lista-solicitudes">
                <tr><td colspan="3" style="color: var(--text-muted); text-align: center;">Sin solicitudes pendientes.</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 2. CREACIÓN DIRECTA DE USUARIOS -->
    <div class="card">
        <div class="section-title">Crear Perfil Manual</div>
        <form onsubmit="crearUsuarioManual(event)" class="form-grid">
            <input type="text" id="nuevo-nombre" placeholder="Nombre completo (Ej: Pedro Martínez)" required>
            <div class="input-group">
                <select id="nuevo-rol">
                    <option value="invitado">Estatus: Invitado</option>
                    <option value="jugador">Estatus: Jugador</option>
                    <option value="admin" id="opt-crear-admin">Estatus: Administrador</option>
                </select>
                <button type="submit" class="btn btn-green">Crear Perfil</button>
            </div>
        </form>
    </div>

    <!-- 3. MESAS ACTIVAS EN CURSO CON DETALLES Y PUNTOS -->
    <div class="card">
        <div class="section-title">Mesas Activas / En Curso</div>
        <div id="lista-mesas">
            <div style="color: var(--text-muted); text-align: center; font-size: 0.85rem;">Cargando mesas...</div>
        </div>
    </div>

    <!-- 4. GESTIÓN DE JUGADORES Y PERMISOS DE ADMIN -->
    <div class="card">
        <div class="section-title">
            <span>Gestión de Jugadores y Permisos</span>
            <input type="text" id="filtro-buscar" placeholder="Buscar..." oninput="filtrarTabla()" style="width: 140px; padding: 6px 10px; font-size: 0.8rem;">
        </div>
        <table class="tabla-custom">
            <thead>
                <tr>
                    <th>Nombre / Usuario</th>
                    <th>Estatus / Rol</th>
                    <th style="text-align: right;">Acciones</th>
                </tr>
            </thead>
            <tbody id="lista-usuarios">
                <tr><td colspan="3" style="color: var(--text-muted); text-align: center;">Cargando usuarios...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    window.onerror = function(msg) {
        mostrarError('Error JS: ' + msg);
        return false;
    };

    function mostrarError(msj) {
        const box = document.getElementById('error-box');
        if (box) {
            box.innerText = msj;
            box.classList.remove('hidden');
        }
    }

    const SUPABASE_URL = 'https://kzbslfwupzwczmjqfjem.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YnNsZnd1cHp3Y3ptanFmamVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDI1MzksImV4cCI6MjEwMjcxODUzOX0.qeeh2FV3zKRet-jRMVvJUwBm9jYHsLbWSYWIao574qc';

    var sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
    var todosLosUsuarios = [];

    document.addEventListener('DOMContentLoaded', async () => {
        if (!sbClient) {
            mostrarError('No se pudo inicializar Supabase.');
            return;
        }
        await refrescarTodo();
    });

    async function refrescarTodo() {
        await cargarSolicitudes();
        await cargarMesasDetalladas();
        await cargarUsuarios();
    }

    // --- 1. SOLICITUDES PENDIENTES (FILTRADAS POR INVITADOS) ---
    async function cargarSolicitudes() {
        const { data: solicitudes, error } = await sbClient
            .from('perfiles')
            .select('*')
            .eq('rol', 'invitado');

        const tbody = document.getElementById('lista-solicitudes');
        const badgeCount = document.getElementById('count-solicitudes');
        tbody.innerHTML = '';

        if (error) {
            tbody.innerHTML = '<tr><td colspan="3" style="color: var(--text-muted); text-align: center;">Error al cargar solicitudes.</td></tr>';
            badgeCount.innerText = '0';
            return;
        }

        badgeCount.innerText = solicitudes ? solicitudes.length : 0;

        if (!solicitudes || solicitudes.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="color: var(--text-muted); text-align: center;">Sin solicitudes pendientes.</td></tr>';
            return;
        }

        solicitudes.forEach(s => {
            tbody.innerHTML += `
                <tr>
                    <td style="font-weight: bold;">${s.nombre_completo || 'Usuario'}</td>
                    <td><span class="badge-rol badge-pendiente">Invitado</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-icon btn-approve" onclick="responderSolicitud('${s.id}', 'jugador')">✓ Aprobar (Jugador)</button>
                            <button class="btn-icon btn-reject" onclick="eliminarPerfil('${s.id}')">✕ Rechazar</button>
                        </div>
                    </td>
                </tr>
            `;
        });
    }

    async function responderSolicitud(userId, nuevoRol) {
        const { error } = await sbClient
            .from('perfiles')
            .update({ rol: nuevoRol })
            .eq('id', userId);

        if (error) mostrarError('Error al aprobar: ' + error.message);
        else await refrescarTodo();
    }

    async function eliminarPerfil(userId) {
        if (!confirm('¿Deseas rechazar y borrar esta solicitud?')) return;
        const { error } = await sbClient
            .from('perfiles')
            .delete()
            .eq('id', userId);

        if (error) mostrarError('Error al eliminar: ' + error.message);
        else await refrescarTodo();
    }

    // --- 2. MESAS DETALLADAS ---
    async function cargarMesasDetalladas() {
        const { data: mesas, error: errMesas } = await sbClient
            .from('mesas')
            .select('*, manos(puntos_pareja1, puntos_pareja2, anulada)')
            .neq('estado', 'finalizada')
            .order('creado_en', { ascending: false });

        const cont = document.getElementById('lista-mesas');
        cont.innerHTML = '';

        if (errMesas) {
            cont.innerHTML = `<div style="color: var(--text-muted); text-align: center;">Error al cargar mesas: ${errMesas.message}</div>`;
            return;
        }

        if (!mesas || mesas.length === 0) {
            cont.innerHTML = '<div style="color: var(--text-muted); text-align: center; font-size: 0.85rem;">No hay mesas activas.</div>';
            return;
        }

        let idsJugadores = [];
        mesas.forEach(m => {
            if (m.jugador1_id) idsJugadores.push(m.jugador1_id);
            if (m.jugador2_id) idsJugadores.push(m.jugador2_id);
            if (m.jugador3_id) idsJugadores.push(m.jugador3_id);
            if (m.jugador4_id) idsJugadores.push(m.jugador4_id);
        });

        idsJugadores = [...new Set(idsJugadores)];

        let mapPerfiles = {};
        if (idsJugadores.length > 0) {
            const { data: perfiles } = await sbClient
                .from('perfiles')
                .select('id, nombre_completo')
                .in('id', idsJugadores);

            if (perfiles) {
                perfiles.forEach(p => {
                    mapPerfiles[p.id] = (p.nombre_completo || 'Jugador').split(' ')[0];
                });
            }
        }

        mesas.forEach((m, idx) => {
            let pts1 = 0, pts2 = 0;
            (m.manos || []).forEach(mano => {
                if (!mano.anulada) {
                    pts1 += (mano.puntos_pareja1 || 0);
                    pts2 += (mano.puntos_pareja2 || 0);
                }
            });

            const p1_j1 = mapPerfiles[m.jugador1_id] || 'Esperando...';
            const p1_j3 = mapPerfiles[m.jugador3_id] || 'Esperando...';
            const p2_j2 = mapPerfiles[m.jugador2_id] || 'Esperando...';
            const p2_j4 = mapPerfiles[m.jugador4_id] || 'Esperando...';

            cont.innerHTML += `
                <div class="mesa-card">
                    <div class="mesa-header">
                        <div>
                            <span class="mesa-titulo">Mesa #${m.id || (idx + 1)}</span>
                            <a href="mesa.html?id=${m.id}" style="color: var(--accent); font-size: 0.8rem; margin-left: 8px; text-decoration: none;" target="_blank">🔗 Ver Mesa</a>
                        </div>
                        <span class="mesa-meta">Meta: ${m.limite_puntos || 200} pts</span>
                    </div>

                    <div class="mesa-detalles">
                        <div class="pareja-box">
                            <div class="pareja-nombres p1-color">${p1_j1} / ${p1_j3}</div>
                            <div class="puntos-num p1-color">${pts1} pts</div>
                        </div>
                        <div class="pareja-box">
                            <div class="pareja-nombres p2-color">${p2_j2} / ${p2_j4}</div>
                            <div class="puntos-num p2-color">${pts2} pts</div>
                        </div>
                    </div>

                    <div class="action-btns" style="margin-top: 4px;">
                        <button class="btn-icon btn-edit" onclick="editarMesa('${m.id}', ${m.limite_puntos || 200})">✏️ Meta</button>
                        <button class="btn-icon btn-reject" onclick="cerrarMesa('${m.id}')">⏹️ Finalizar Mesa</button>
                    </div>
                </div>
            `;
        });
    }

    async function editarMesa(mesaId, limiteActual) {
        const nuevaMeta = prompt('Nueva meta de puntos para la mesa:', limiteActual);
        if (!nuevaMeta || isNaN(nuevaMeta)) return;

        const { error } = await sbClient
            .from('mesas')
            .update({ limite_puntos: parseInt(nuevaMeta) })
            .eq('id', mesaId);

        if (error) mostrarError('Error al actualizar mesa: ' + error.message);
        else cargarMesasDetalladas();
    }

    async function cerrarMesa(mesaId) {
        if (!confirm('¿Deseas finalizar manualmente esta mesa?')) return;

        const { error } = await sbClient
            .from('mesas')
            .update({ estado: 'finalizada' })
            .eq('id', mesaId);

        if (error) mostrarError('Error al cerrar mesa: ' + error.message);
        else cargarMesasDetalladas();
    }

    // --- 3. CREAR JUGADOR MANUALMENTE ---
    async function crearUsuarioManual(e) {
        e.preventDefault();
        const inputNombre = document.getElementById('nuevo-nombre');
        const selectRol = document.getElementById('nuevo-rol');

        const nombre = inputNombre.value.trim();
        const rol = selectRol.value;

        const { error } = await sbClient
            .from('perfiles')
            .insert([{
                nombre_completo: nombre,
                rol: rol
            }]);

        if (error) {
            mostrarError('Error al crear perfil: ' + error.message);
        } else {
            inputNombre.value = '';
            alert('Perfil creado correctamente.');
            await refrescarTodo();
        }
    }

    // --- 4. GESTIÓN DE JUGADORES Y ASIGNACIÓN DIRECTA DE ADMIN ---
    async function cargarUsuarios() {
        const { data: perfiles, error } = await sbClient
            .from('perfiles')
            .select('*')
            .order('nombre_completo', { ascending: true });

        if (error) {
            mostrarError('Error al cargar perfiles: ' + error.message);
            return;
        }

        todosLosUsuarios = perfiles || [];
        renderizarTablaUsuarios(todosLosUsuarios);
    }

    function renderizarTablaUsuarios(lista) {
        const tbody = document.getElementById('lista-usuarios');
        tbody.innerHTML = '';

        if (lista.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="color: var(--text-muted); text-align: center;">No hay usuarios registrados.</td></tr>';
            return;
        }

        lista.forEach(u => {
            let badgeClass = 'badge-jugador';
            let rolTexto = 'Jugador';

            if (u.rol === 'invitado') { badgeClass = 'badge-invitado'; rolTexto = 'Invitado'; }
            else if (u.rol === 'admin') { badgeClass = 'badge-admin'; rolTexto = 'Admin'; }
            else if (u.rol === 'super_admin') { badgeClass = 'badge-superadmin'; rolTexto = 'Super Admin'; }

            // Botones de acción directa
            let btnAdminHTML = '';
            if (u.rol === 'super_admin') {
                btnAdminHTML = `<span style="font-size:0.75rem; color:var(--role-superadmin); font-weight:bold;">Propietario</span>`;
            } else if (u.rol === 'admin') {
                btnAdminHTML = `<button class="btn-icon btn-reject" onclick="cambiarRolAdmin('${u.id}', 'jugador')" title="Quitar Admin">🔻 Quitar Admin</button>`;
            } else {
                btnAdminHTML = `<button class="btn-icon btn-admin" onclick="cambiarRolAdmin('${u.id}', 'admin')" title="Hacer Admin">⭐ Hacer Admin</button>`;
            }

            tbody.innerHTML += `
                <tr>
                    <td style="font-weight: bold;">${u.nombre_completo || 'Sin nombre'}</td>
                    <td><span class="badge-rol ${badgeClass}">${rolTexto}</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-icon btn-edit" onclick="cambiarNombre('${u.id}', '${u.nombre_completo || ''}')" title="Cambiar Nombre">✏️</button>
                            <button class="btn-icon btn-toggle" onclick="alternarEstatus('${u.id}', '${u.rol || 'jugador'}')" title="Alternar Invitado/Jugador">🔄 Rol</button>
                            ${btnAdminHTML}
                        </div>
                    </td>
                </tr>
            `;
        });
    }

    async function cambiarRolAdmin(userId, nuevoRol) {
        const { error } = await sbClient
            .from('perfiles')
            .update({ rol: nuevoRol })
            .eq('id', userId);

        if (error) {
            mostrarError('Error al cambiar rol: ' + error.message);
        } else {
            await refrescarTodo();
        }
    }

    async function cambiarNombre(userId, nombreActual) {
        const nuevoNombre = prompt('Editar nombre del jugador:', nombreActual);
        if (nuevoNombre === null || nuevoNombre.trim() === '') return;

        const { error } = await sbClient
            .from('perfiles')
            .update({ nombre_completo: nuevoNombre.trim() })
            .eq('id', userId);

        if (error) mostrarError('Error al cambiar nombre: ' + error.message);
        else refrescarTodo();
    }

    async function alternarEstatus(userId, rolActual) {
        if (rolActual === 'super_admin' || rolActual === 'admin') {
            alert('Para cambiar el estatus de un Administrador debes usar el botón de quitar Admin primero.');
            return;
        }

        const nuevoRol = rolActual === 'invitado' ? 'jugador' : 'invitado';

        const { error } = await sbClient
            .from('perfiles')
            .update({ rol: nuevoRol })
            .eq('id', userId);

        if (error) mostrarError('Error al cambiar estatus: ' + error.message);
        else refrescarTodo();
    }

    function filtrarTabla() {
        const q = document.getElementById('filtro-buscar').value.toLowerCase();
        const filtrados = todosLosUsuarios.filter(u => 
            (u.nombre_completo || '').toLowerCase().includes(q)
        );
        renderizarTablaUsuarios(filtrados);
    }
</script>
</body>
</html>
