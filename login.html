<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Dominó y Romo — Acceso</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1120">
    <!-- Archivo de caché centralizado -->
    <script src="cache.js"></script>
    <script>
        // Carga inmediata del tema antes de renderizar
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.classList.add('light-mode');
            }
        })();
    </script>
    <style>
    :root {
        --bg-color: #0b1120;
        --card-bg: #152238;
        --input-bg: #1e2d4a;
        --border-color: #263859;
        
        --accent-blue: #2563eb;
        --accent-blue-hover: #1d4ed8;
        --accent-green: #10b981;
        --accent-green-hover: #059669;
        --accent-red: #ef4444;
        --accent-purple: #8b5cf6;
        --accent-amber: #f59e0b;
        
        --text: #ffffff;
        --text-muted: #8e9bb0;
        --cyan-title: #38bdf8;

        --sub-bg: #0d1726;
        --score-bg: #152238;
        --table-border: rgba(255,255,255,0.05);
        --progress-bg: #0b1120;
    }

    html.light-mode {
        --bg-color: #f1f5f9;
        --card-bg: #ffffff;
        --input-bg: #f8fafc;
        --border-color: #cbd5e1;
        
        --text: #0f172a;
        --text-muted: #64748b;
        --cyan-title: #0284c7;

        --sub-bg: #f8fafc;
        --score-bg: #f1f5f9;
        --table-border: rgba(0,0,0,0.08);
        --progress-bg: #e2e8f0;
    }

    * { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    body { 
        background-color: var(--bg-color); 
        color: var(--text); 
        padding: 16px 12px; 
        display: flex; 
        justify-content: center; 
    }

    .container { 
        width: 100%; 
        max-width: 520px; 
        display: flex; 
        flex-direction: column; 
        gap: 16px; 
    } 
    
    header { 
        text-align: center; 
        padding: 8px 0 12px 0; 
    }
    header h1 { 
        font-size: 2rem; 
        font-weight: 900; 
        color: var(--cyan-title); 
        letter-spacing: -0.5px;
    }
    header p { 
        color: var(--text-muted); 
        font-size: 0.9rem; 
        margin-top: 2px;
    }

    .card { 
        background: var(--card-bg); 
        border-radius: 16px; 
        padding: 18px; 
        border: 1px solid var(--border-color); 
    }

    .galardon-card {
        background: linear-gradient(135deg, #1c1404, #2c1a04);
        border: 1px solid #f59e0b;
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 4px 15px rgba(245, 158, 11, 0.15);
    }
    .galardon-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
    }
    .galardon-header h3 {
        font-size: 1.05rem;
        font-weight: 800;
        color: var(--accent-amber);
    }
    .on-fire-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.25);
        padding: 12px;
        border-radius: 10px;
        border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .auth-tabs-box {
        background: var(--sub-bg);
        padding: 6px;
        border-radius: 12px;
        display: flex;
        gap: 6px;
        margin-bottom: 16px;
        border: 1px solid var(--border-color);
    }
    
    .tab-btn { 
        flex: 1; 
        min-height: 42px; 
        background: transparent; 
        border: none; 
        color: var(--text-muted); 
        font-size: 0.95rem; 
        font-weight: 700; 
        cursor: pointer; 
        border-radius: 8px; 
        transition: all 0.2s;
    }
    .tab-btn.active { 
        background: var(--accent-blue); 
        color: white; 
    }

    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    
    input, select { 
        width: 100%; 
        padding: 12px 14px; 
        border-radius: 10px; 
        border: 1px solid var(--border-color); 
        background: var(--input-bg); 
        color: var(--text); 
        font-size: 1rem; 
        outline: none;
    }
    input::placeholder { color: var(--text-muted); opacity: 0.7; }
    input:focus, select:focus { border-color: var(--accent-blue); }

    .btn { 
        width: 100%; 
        min-height: 48px; 
        padding: 12px; 
        border: none; 
        border-radius: 10px; 
        font-weight: 800; 
        cursor: pointer; 
        background: var(--accent-blue); 
        color: white; 
        font-size: 1rem; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        gap: 8px;
        text-decoration: none; 
        transition: opacity 0.2s; 
    }
    .btn:active { opacity: 0.85; }
    .btn-green { background: var(--accent-green); }
    .btn-secondary { background: var(--input-bg); color: var(--text); border: 1px solid var(--border-color); }
    .btn-danger { background: var(--accent-red); }
    .btn-admin { background: var(--accent-purple); color: white; }
    .btn-amber { background: var(--accent-amber); color: #000; }

    .user-info-bar { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        background: var(--sub-bg); 
        padding: 12px 14px; 
        border-radius: 10px; 
        border: 1px solid var(--border-color);
    }
    
    .equipos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
    .equipo-card-box { 
        background: var(--sub-bg); 
        border: 1px solid var(--border-color); 
        border-radius: 10px; 
        padding: 12px; 
        display: flex; 
        flex-direction: column; 
        gap: 8px; 
    }
    .equipo-card-box h4 { font-size: 0.85rem; font-weight: 800; color: var(--cyan-title); }

    .filtros-box {
        background: var(--sub-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 12px;
        margin-top: 10px;
        margin-bottom: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    .filtro-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .filtro-item.full-width {
        grid-column: span 2;
    }
    .filtro-item label {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .filtro-item input, .filtro-item select {
        padding: 8px 10px;
        font-size: 0.85rem;
        border-radius: 8px;
        background: var(--input-bg);
    }
    .btn-limpiar-filtros {
        background: var(--input-bg);
        color: var(--text);
        border: 1px solid var(--border-color);
        font-weight: 700;
        font-size: 0.85rem;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
        transition: background 0.2s;
        min-height: 38px;
    }
    .btn-limpiar-filtros:hover {
        opacity: 0.8;
    }

    .tabla-stats { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; margin-top: 6px; }
    .tabla-stats th { padding: 10px 8px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); font-weight: 600; }
    .tabla-stats td { padding: 10px 8px; border-bottom: 1px solid var(--table-border); vertical-align: middle; }
    .progress-container { display: flex; align-items: center; gap: 8px; }
    .progress-bar-bg { flex-grow: 1; background: var(--progress-bg); height: 8px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); }
    .progress-bar-fill { height: 100%; background: var(--accent-green); border-radius: 4px; }
    .eficiencia-txt { min-width: 42px; text-align: right; font-weight: bold; font-size: 0.75rem; }

    .mesas-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
    .mesa-card-vivo { 
        background: var(--sub-bg); 
        border: 1px solid var(--border-color); 
        border-radius: 12px; 
        padding: 14px; 
        display: flex; 
        flex-direction: column; 
        gap: 12px; 
    }
    
    .marcador-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .equipo-score-box { 
        background: var(--score-bg); 
        border-radius: 10px; 
        padding: 10px; 
        border: 1px solid var(--border-color);
    }
    .equipo-score-box.team-a { border-color: rgba(56, 189, 248, 0.4); }
    .equipo-score-box.team-b { border-color: rgba(239, 68, 68, 0.4); }
    
    .score-a { color: var(--cyan-title); font-size: 2rem; font-weight: 900; line-height: 1; margin-top: 6px; }
    .score-b { color: var(--accent-red); font-size: 2rem; font-weight: 900; line-height: 1; margin-top: 6px; }

    .progress-track { width: 100%; height: 8px; background: var(--progress-bg); border-radius: 6px; overflow: hidden; margin-top: 4px; border: 1px solid var(--border-color); }
    .progress-fill { height: 100%; background: var(--accent-green); transition: width 0.3s ease; }

    .hidden { display: none !important; }
    .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
    .status-aprobado { background: #065f46; color: #34d399; }
    .status-pendiente { background: #854d0e; color: #fef08a; }
    
    .cumple-banner {
        background: linear-gradient(135deg, #1e1b4b, #312e81);
        border: 1px solid #6366f1;
        border-radius: 14px;
        padding: 14px;
        text-align: center;
        color: #e0e7ff;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        animation: pulse-glow 2s infinite;
    }
    @keyframes pulse-glow {
        0% { border-color: #6366f1; }
        50% { border-color: #a5b4fc; box-shadow: 0 4px 20px rgba(165, 180, 252, 0.4); }
        100% { border-color: #6366f1; }
    }
    </style>
</head>

<body>
<div class="container"><header>
        <img src="logo.png" alt="Logo" width="150">
        <h1>Club Dominó y Romo</h1>
        <p>Sistema de Anote y Estadísticas</p>
    </header><!-- SECCIÓN DE AUTENTICACIÓN -->
    <div id="auth-section" class="card">
        <div class="auth-tabs-box" id="tabs-header">
            <button class="tab-btn active" onclick="switchTab('login')">Iniciar Sesión</button>
            <button class="tab-btn" onclick="switchTab('register')">Registrarse</button>
        </div>

        <form id="login-form" onsubmit="loginUsuario(event)">
            <div>
                <label>Correo Electrónico</label>
                <input type="email" id="login-email" required placeholder="correo@ejemplo.com">
            </div>
            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <label>Contraseña</label>
                    <a href="#" onclick="recuperarClave(event)" style="font-size: 0.8rem; color: var(--cyan-title); text-decoration: none;">¿Olvidaste tu contraseña?</a>
                </div>
                <input type="password" id="login-password" required placeholder="******">
            </div>
            <button type="submit" class="btn">Entrar</button>
            <button type="button" class="btn btn-secondary" onclick="entrarModoInvitado()">Modo Invitado (Solo Lectura)</button>
        </form>

        <form id="register-form" class="hidden" onsubmit="registrarUsuario(event)">
            <div>
                <label>Nombre Completo</label>
                <input type="text" id="reg-nombre" required placeholder="Ej. Juan Pérez">
            </div>
            <div>
                <label>Usuario / Alias (para la jugada)</label>
                <input type="text" id="reg-username" required placeholder="Ej. JuanP23">
            </div>
            <div>
                <label>Correo Electrónico</label>
                <input type="email" id="reg-email" required placeholder="correo@ejemplo.com">
            </div>
            <div>
                <label>Contraseña</label>
                <input type="password" id="reg-password" required minlength="6" placeholder="Mínimo 6 caracteres">
            </div>
            <button type="submit" class="btn">Crear Cuenta</button>
        </form>

        <form id="recovery-form" class="hidden" onsubmit="guardarNuevaClave(event)">
            <h3 style="color: var(--cyan-title); font-size: 1rem; margin-bottom: 4px;">Restablecer Contraseña</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">Ingresa tu nueva contraseña para actualizar el acceso.</p>
            <div>
                <label>Nueva Contraseña</label>
                <input type="password" id="new-password" required minlength="6" placeholder="Mínimo 6 caracteres">
            </div>
            <button type="submit" class="btn">Guardar Nueva Contraseña</button>
        </form>

        <div style="margin-top: 14px; border-top: 1px solid var(--border-color); padding-top: 14px;">
            <a href="apunte.html" class="btn btn-amber" style="text-decoration: none;">🎲 Anote Local (Familia y Amigos)</a>
        </div>
    </div>

    </div>
<script>
const SUPABASE_URL = 'https://kzbslfwupzwczmjqfjem.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YnNsZnd1cHp3Y3ptanFmamVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDI1MzksImV4cCI6MjEwMjcxODUzOX0.qeeh2FV3zKRet-jRMVvJUwBm9jYHsLbWSYWIao574qc';

    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('recovery-form').classList.add('hidden');
        document.getElementById('tabs-header').classList.remove('hidden');

        if(tab === 'login') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('register-form').classList.add('hidden');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
        }
    }

    function mostrarFormularioRecuperacion() {
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('user-logged-section').classList.add('hidden');
        document.getElementById('tabs-header').classList.add('hidden');
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('register-form').classList.add('hidden');
        document.getElementById('recovery-form').classList.remove('hidden');
    }

    async function loginUsuario(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        const { error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) alert('Error al iniciar sesión: ' + error.message);
        else {
            localStorage.removeItem('modo_invitado');
            window.location.href = 'lobby.html';
        }
    }

    async function recuperarClave(e) {
        if (e) e.preventDefault();
        const email = document.getElementById('login-email').value || prompt('Ingresa tu correo electrónico registrado:');
        
        if (!email) return;

        const redirectUrl = new URL('login.html', window.location.href).href;

        const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: redirectUrl
        });

        if (error) alert('Error al enviar solicitud: ' + error.message);
        else alert('Te hemos enviado un correo electrónico para restablecer tu contraseña.');
    }

    async function guardarNuevaClave(e) {
        e.preventDefault();
        const newPassInput = document.getElementById('new-password');
        if (!newPassInput) return;
        const newPassword = newPassInput.value;

        const { error } = await supabase.auth.updateUser({ password: newPassword });

        if (error) {
            alert('Error al cambiar la contraseña: ' + error.message);
        } else {
            alert('¡Contraseña actualizada correctamente! Por seguridad, inicia sesión con tu nueva clave.');
            await supabase.auth.signOut();
            window.history.replaceState({}, document.title, window.location.pathname);
            location.reload();
        }
    }

    async function registrarUsuario(e) {
        e.preventDefault();
        const nombre = document.getElementById('reg-nombre').value;
        const username = document.getElementById('reg-username').value.trim();
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: { 
                data: { 
                    nombre_completo: nombre,
                    username: username
                } 
            }
        });

        if (error) {
            alert('Error al registrar: ' + error.message);
            return;
        }

        alert('Registro completado. Tu cuenta requerirá aprobación del Administrador.');
        switchTab('login');
    }

    function entrarModoInvitado() {
        localStorage.setItem('modo_invitado', 'true');
        window.location.href = 'lobby.html';
    }
window.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const hasCode = params.has('code');
    const hasRecoveryHash = window.location.hash.includes('type=recovery');
    if (hasCode || hasRecoveryHash) {
        mostrarFormularioRecuperacion();
    } else {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) { window.location.replace('lobby.html'); return; }
        document.getElementById('auth-section').classList.remove('hidden');
    }
    supabase.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') mostrarFormularioRecuperacion();
    });
});
</script>
</body>
</html>
