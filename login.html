<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Dominó y Romo - Ingreso</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1329">
    <script>
    (function() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.documentElement.classList.add('light-mode');
        }
    })();
    </script>
    <style>
    :root {
        --bg-color: #0b1120;
        --card-bg: #152238;
        --input-bg: #1e2d4a;
        --border-color: #263859;
        --accent-blue: #2563eb;
        --accent-amber: #f59e0b;
        --text: #ffffff;
        --text-muted: #8e9bb0;
        --cyan-title: #38bdf8;
        --sub-bg: #0d1726;
    }
    html.light-mode {
        --bg-color: #f1f5f9;
        --card-bg: #ffffff;
        --input-bg: #f8fafc;
        --border-color: #cbd5e1;
        --text: #0f172a;
        --text-muted: #64748b;
        --cyan-title: #0284c7;
        --sub-bg: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 16px 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; } 
    header { text-align: center; padding: 8px 0 12px 0; }
    header h1 { font-size: 2rem; font-weight: 900; color: var(--cyan-title); letter-spacing: -0.5px; }
    header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 2px; }
    .card { background: var(--card-bg); border-radius: 16px; padding: 18px; border: 1px solid var(--border-color); }
    .auth-tabs-box { background: var(--sub-bg); padding: 6px; border-radius: 12px; display: flex; gap: 6px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    .tab-btn { flex: 1; min-height: 42px; background: transparent; border: none; color: var(--text-muted); font-size: 0.95rem; font-weight: 700; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
    .tab-btn.active { background: var(--accent-blue); color: white; }
    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text); font-size: 1rem; outline: none; }
    input:focus { border-color: var(--accent-blue); }
    .btn { width: 100%; min-height: 48px; padding: 12px; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; background: var(--accent-blue); color: white; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
    .btn-secondary { background: var(--input-bg); color: var(--text); border: 1px solid var(--border-color); }
    .btn-amber { background: var(--accent-amber); color: #000; }
    .hidden { display: none !important; }
    .cumple-banner { background: linear-gradient(135deg, #1e1b4b, #312e81); border: 1px solid #6366f1; border-radius: 14px; padding: 14px; text-align: center; color: #e0e7ff; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="logo.png" alt="Logo" width="150">
            <h1>Club Dominó y Romo</h1>
            <p>Sistema de Anote y Estadísticas</p>
        </header>

        <div id="cumpleanos-banner" class="cumple-banner hidden">
            <div style="font-size: 1.3rem; font-weight: 900; color: #fde047; margin-bottom: 4px;">🎉 ¡Feliz Cumpleaños! 🎂</div>
            <p id="cumpleanos-texto" style="font-size: 0.9rem; font-weight: 600;"></p>
        </div>

        <div id="auth-section" class="card">
            <div class="auth-tabs-box" id="tabs-header">
                <button class="tab-btn active" onclick="switchTab('login')">Iniciar Sesión</button>
                <button class="tab-btn" onclick="switchTab('register')">Registrarse</button>
            </div>

            <form id="login-form" onsubmit="loginUsuario(event)">
                <div>
                    <label>Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="correo@ejemplo.com">
                </div>
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                        <label>Contraseña</label>
                        <a href="#" onclick="recuperarClave(event)" style="font-size: 0.8rem; color: var(--cyan-title); text-decoration: none;">¿Olvidaste tu contraseña?</a>
                    </div>
                    <input type="password" id="login-password" required placeholder="******">
                </div>
                <button type="submit" class="btn">Entrar</button>
                <button type="button" class="btn btn-secondary" onclick="entrarModoInvitado()">Modo Invitado (Solo Lectura)</button>
            </form>

            <form id="register-form" class="hidden" onsubmit="registrarUsuario(event)">
                <div>
                    <label>Nombre Completo</label>
                    <input type="text" id="reg-nombre" required placeholder="Ej. Juan Pérez">
                </div>
                <div>
                    <label>Usuario / Alias (para la jugada)</label>
                    <input type="text" id="reg-username" required placeholder="Ej. JuanP23">
                </div>
                <div>
                    <label>Correo Electrónico</label>
                    <input type="email" id="reg-email" required placeholder="correo@ejemplo.com">
                </div>
                <div>
                    <label>Contraseña</label>
                    <input type="password" id="reg-password" required minlength="6" placeholder="Mínimo 6 caracteres">
                </div>
                <button type="submit" class="btn">Crear Cuenta</button>
            </form>

            <form id="recovery-form" class="hidden" onsubmit="guardarNuevaClave(event)">
                <h3 style="color: var(--cyan-title); font-size: 1rem; margin-bottom: 4px;">Restablecer Contraseña</h3>
                <div>
                    <label>Nueva Contraseña</label>
                    <input type="password" id="new-password" required minlength="6" placeholder="Mínimo 6 caracteres">
                </div>
                <button type="submit" class="btn" style="margin-top: 8px;">Guardar Nueva Contraseña</button>
            </form>

            <div style="margin-top: 14px; border-top: 1px solid var(--border-color); padding-top: 14px;">
                <a href="apunte.html" class="btn btn-amber" style="text-decoration: none;">🎲 Anote Local (Familia y Amigos)</a>
            </div>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://kzbslfwupzwczmjqfjem.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YnNsZnd1cHp3Y3ptanFmamVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDI1MzksImV4cCI6MjEwMjcxODUzOX0.qeeh2FV3zKRet-jRMVvJUwBm9jYHsLbWSYWIao574qc';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.addEventListener('DOMContentLoaded', async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (session || localStorage.getItem('modo_invitado') === 'true') {
            window.location.href = 'index.html';
            return;
        }

        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                document.getElementById('tabs-header').classList.add('hidden');
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('recovery-form').classList.remove('hidden');
            } else if (session) {
                window.location.href = 'index.html';
            }
        });
    });

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if(tab === 'login') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('register-form').classList.add('hidden');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
        }
    }

    async function loginUsuario(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) alert('Error: ' + error.message);
        else {
            localStorage.removeItem('modo_invitado');
            window.location.href = 'index.html';
        }
    }

    async function registrarUsuario(e) {
        e.preventDefault();
        const nombre = document.getElementById('reg-nombre').value;
        const username = document.getElementById('reg-username').value.trim();
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        const { error } = await supabase.auth.signUp({
            email, password,
            options: { data: { nombre_completo: nombre, username } }
        });
        if (error) alert('Error: ' + error.message);
        else {
            alert('Registro completado. Requiere aprobación del Administrador.');
            switchTab('login');
        }
    }

    async function recuperarClave(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value || prompt('Ingresa tu correo:');
        if (!email) return;
        const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
        if (error) alert('Error: ' + error.message);
        else alert('Te hemos enviado un correo para restablecer tu contraseña.');
    }

    async function guardarNuevaClave(e) {
        e.preventDefault();
        const newPassword = document.getElementById('new-password').value;
        const { error } = await supabase.auth.updateUser({ password: newPassword });
        if (error) alert('Error: ' + error.message);
        else {
            alert('Contraseña actualizada.');
            window.location.href = 'login.html';
        }
    }

    function entrarModoInvitado() {
        localStorage.setItem('modo_invitado', 'true');
        window.location.href = 'dashboard.html';
    }
</script>
</body>
</html>
